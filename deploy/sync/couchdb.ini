; CouchDB para o Self-hosted LiveSync (Obsidian).
; Toda requisição exige usuário; CORS só para as origens do app do Obsidian
; (desktop, iOS e Android). Os limites de tamanho são os que o plugin pede.

[couchdb]
single_node = true
max_document_size = 50000000

[cluster]
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
