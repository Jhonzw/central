# Central dentro de um site que já existe, em https://seu-dominio/central/.
# Incluir no bloco HTTPS do domínio:   include /etc/nginx/central-caminho.conf;
# e subir a Central com CENTRAL_BASE=/central CENTRAL_HTTPS=1 CENTRAL_DOMINIO=seu-dominio.
# O limit_req_zone mora no contexto http: conf.d/central-limite.conf com a linha
#   limit_req_zone $binary_remote_addr zone=central_entrar:1m rate=6r/m;

location = /central { return 301 /central/; }

# Tentativa de login: no máximo 6 por minuto por IP, antes mesmo de chegar à Central.
location ~ ^/central/api/(entrar|convite/) {
    limit_req zone=central_entrar burst=3 nodelay;
    limit_req_status 429;
    rewrite ^/central(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:7800;
    include /etc/nginx/central-proxy.conf;
}
# O processo do WhatsApp fala com a Central por dentro do Docker, nunca pela internet.
location ^~ /central/api/ingest/whatsapp/ { return 404; }
# Sem ^~ de propósito: assim a regra do login (regex acima) ainda vale para /central/api/entrar.
location /central/ {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:7800/;
    include /etc/nginx/central-proxy.conf;
}
