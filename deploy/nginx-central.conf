# nginx na frente da Central (troque central.exemplo.com.br pelo seu domínio
# e rode o certbot --nginx -d central.exemplo.com.br para o HTTPS).
# O limit_req_zone precisa estar no contexto http (conf.d/ já está).

limit_req_zone $binary_remote_addr zone=central_entrar:1m rate=6r/m;

server {
    server_name central.exemplo.com.br;
    client_max_body_size 2m;

    # Tentativa de login: no máximo 6 por minuto por IP, antes mesmo de chegar à Central.
    location ~ ^/api/(entrar|convite/) {
        limit_req zone=central_entrar burst=3 nodelay;
    limit_req_status 429;
        proxy_pass http://127.0.0.1:7800;
        include /etc/nginx/central-proxy.conf;
    }
    # A entrada das máquinas (painéis, WhatsApp) não vem da internet.
    location /api/ingest/whatsapp/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:7800;
        include /etc/nginx/central-proxy.conf;
    }
    listen 80;
}
