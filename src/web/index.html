<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312161e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%235eead4'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235eead4' stroke-opacity='.4' stroke-width='1.6'/%3E%3C/svg%3E">
<title>Central</title>
<style>
  /* IBM Plex servida pela própria Central (OFL): a página não chama ninguém de fora.
     Ícones desenhados no traço do Lucide (ISC). */
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; font-display: swap; src: url(fontes/plex-sans.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fontes/plex-mono-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fontes/plex-mono-500.woff2) format("woff2"); }

  /* Um tema só, escuro. A cor de verdade fica para duas coisas: o espaço de
     cada conversa (a cor da empresa) e a única ação que importa na tela. */
  :root {
    color-scheme: dark;
    --chao: #0a0c10; --lado: #0d1016; --sup: #12161e; --sup2: #171c26; --sup3: #1d2330;
    --fio: rgba(255,255,255,.07); --fio2: rgba(255,255,255,.12);
    --tinta: #e7ebf2; --suave: #9aa3b3; --apagado: #687183;
    --acento: #5eead4; --acento-tinta: #03201b; --acento-fundo: rgba(94,234,212,.10);
    --wa: #25d366; --wa-tinta: #052e16;
    --bom: #4ade80; --aviso: #fbbf24; --mal: #f87171; --mal-fundo: rgba(248,113,113,.10);
    --raio: 14px; --raio-p: 9px;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--chao); }
  body { margin: 0; color: var(--tinta); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased; background:
      radial-gradient(900px 500px at 0% -10%, rgba(94,234,212,.07), transparent 60%),
      radial-gradient(700px 500px at 100% 110%, rgba(99,102,241,.06), transparent 60%), var(--chao);
    background-attachment: fixed; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); }

  /* ---------- Casca ---------- */
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
  .lado { position: sticky; top: 0; height: 100vh; overflow: auto; background: color-mix(in srgb, var(--lado) 88%, transparent);
    border-right: 1px solid var(--fio); backdrop-filter: blur(16px); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -.01em; padding: 2px 8px; }
  .marca svg { width: 26px; height: 26px; }
  .buscar { position: relative; }
  .buscar .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--apagado); width: 16px; }
  .buscar input { width: 100%; padding: 8px 10px 8px 34px; border-radius: var(--raio-p); border: 1px solid var(--fio); background: var(--sup); font-size: 14px; }
  .buscar input::placeholder { color: var(--apagado); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--raio-p); color: var(--suave);
    border: 0; background: none; width: 100%; text-align: left; font-size: 14.5px; }
  .nav-item:hover { background: var(--sup); color: var(--tinta); }
  .nav-item[aria-current] { background: var(--sup2); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--fio); }
  .nav-item[aria-current] .ico { color: var(--acento); }
  .nav-item .n { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--apagado); }
  .nav-item .n.quente { background: var(--acento); color: var(--acento-tinta); padding: 4px 7px; border-radius: 999px; }
  .titulo-lado { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--apagado); padding: 0 10px; margin-bottom: 6px; }
  .bolinha { width: 9px; height: 9px; border-radius: 3px; background: var(--cor, #888); flex: none; }
  .pe-lado { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--fio); padding-top: 12px; }
  .principal { min-width: 0; }
  .pagina { max-width: 1180px; margin: 0 auto; padding: 30px 32px 90px; }
  .abas-movel { display: none; }

  /* ---------- Peças ---------- */
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .cab h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.025em; }
  .cab p { margin: 6px 0 0; color: var(--suave); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--raio-p); border: 1px solid var(--fio2);
    background: var(--sup2); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--sup3); }
  .btn.primario { background: var(--acento); border-color: transparent; color: var(--acento-tinta); }
  .btn.primario:hover { filter: brightness(1.08); }
  .btn.wa { background: var(--wa); border-color: transparent; color: var(--wa-tinta); }
  .btn.fantasma { background: none; border-color: transparent; color: var(--suave); }
  .btn.fantasma:hover { background: var(--sup); color: var(--tinta); }
  .btn.perigo:hover { color: var(--mal); border-color: var(--mal); }
  .btn.mini { padding: 4px 10px; font-size: 13px; }
  .btn .ico { width: 16px; height: 16px; }
  .kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--fio2); color: var(--apagado); }
  .btn.primario .kbd, .btn.wa .kbd { border-color: rgba(0,0,0,.2); color: inherit; opacity: .6; }
  input, select, textarea { padding: 9px 11px; border: 1px solid var(--fio2); border-radius: var(--raio-p); background: var(--sup); font-size: 14px; width: 100%; }
  input::placeholder, textarea::placeholder { color: var(--apagado); }
  textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  label { display: block; font-size: 12.5px; color: var(--suave); }
  label > input, label > select, label > textarea { margin-top: 5px; }
  .cartao { background: linear-gradient(180deg, var(--sup), color-mix(in srgb, var(--sup) 70%, var(--chao))); border: 1px solid var(--fio);
    border-radius: var(--raio); box-shadow: 0 1px 0 rgba(255,255,255,.03) inset; }
  .cartao-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--fio); }
  .cartao-cab h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
  .cartao-cab h2 .ico { color: var(--suave); }
  .cartao-cab small { color: var(--apagado); font: 500 12px/1 var(--mono); }
  .vazio { padding: 26px 16px; text-align: center; color: var(--apagado); font-size: 14px; }
  .vazio b { display: block; color: var(--suave); font-weight: 500; margin-bottom: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; color: var(--suave);
    background: var(--sup2); border: 1px solid var(--fio); white-space: nowrap; }
  .chip .bolinha { width: 7px; height: 7px; border-radius: 2px; }
  .chip.mal { color: var(--mal); border-color: color-mix(in srgb, var(--mal) 35%, transparent); background: var(--mal-fundo); }
  .chip.bom { color: var(--bom); }
  .segmento { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sup); border: 1px solid var(--fio); gap: 2px; flex-wrap: wrap; }
  .segmento button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--suave); font-size: 13.5px; display: inline-flex; gap: 7px; align-items: center; }
  .segmento button[aria-pressed="true"] { background: var(--sup3); color: var(--tinta); box-shadow: 0 0 0 1px var(--fio2); }
  .segmento .n { font: 500 11.5px/1 var(--mono); color: var(--apagado); }
  .segmento [aria-pressed="true"] .n { color: var(--acento); }
  .avatar { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; position: relative;
    font-weight: 600; font-size: 14px; color: var(--tinta); background: color-mix(in srgb, var(--cor, #888) 26%, var(--sup2));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cor, #888) 40%, transparent); }
  .avatar .canal { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center;
    background: var(--sup3); box-shadow: 0 0 0 2px var(--sup); }
  .avatar .canal .ico { width: 11px; height: 11px; stroke-width: 2.4; }
  .avatar .canal.whatsapp { background: var(--wa); color: var(--wa-tinta); }
  .avatar .canal.email { background: #93c5fd; color: #0b1b33; }
  .avatar.g { width: 46px; height: 46px; font-size: 16px; border-radius: 14px; }
  .toque { cursor: pointer; }
  .erro-faixa { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--raio-p); background: var(--mal-fundo); color: var(--mal); font-size: 14px;
    border: 1px solid color-mix(in srgb, var(--mal) 30%, transparent); }

  /* ---------- Hoje ---------- */
  .numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .numero { padding: 16px 16px 14px; text-align: left; border: 1px solid var(--fio); border-radius: var(--raio); background: var(--sup); position: relative; overflow: hidden; }
  .numero:hover { border-color: var(--fio2); background: var(--sup2); }
  .numero .ico { color: var(--apagado); }
  .numero b { display: block; font: 600 34px/1 var(--sans); letter-spacing: -.03em; margin: 14px 0 4px; }
  .numero span { color: var(--suave); font-size: 13.5px; }
  .numero.quente { border-color: color-mix(in srgb, var(--acento) 35%, transparent); background: linear-gradient(160deg, var(--acento-fundo), var(--sup) 70%); }
  .numero.quente .ico, .numero.quente b { color: var(--acento); }
  .numero.alerta b, .numero.alerta .ico { color: var(--mal); }
  .numero.zero b { color: var(--apagado); }
  .duas { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .fila-item { display: flex; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--fio); }
  .fila-item:first-child { border-top: 0; }
  .fila-item:hover { background: rgba(255,255,255,.02); }
  .fila-item .txt { min-width: 0; flex: 1; }
  .fila-item .nome { font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
  .fila-item .nome span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-item .prev { color: var(--suave); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .idade { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--apagado); white-space: nowrap; }
  .idade.morna { color: var(--aviso); } .idade.velha { color: var(--mal); }
  .rapida { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--fio); }
  .rapida select { width: auto; max-width: 130px; }
  .tarefa { display: flex; gap: 12px; align-items: flex-start; padding: 11px 16px; border-top: 1px solid var(--fio); }
  .tarefa:first-child { border-top: 0; }
  .tarefa:hover { background: rgba(255,255,255,.02); }
  .marcar { width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; border: 1.6px solid var(--fio2); background: none; flex: none; display: grid; place-items: center; padding: 0; color: transparent; }
  .marcar:hover { border-color: var(--acento); color: var(--acento); }
  .marcar.feito { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
  .marcar .ico { width: 13px; height: 13px; stroke-width: 3; }
  .tarefa .txt { flex: 1; min-width: 0; }
  .tarefa .t { font-weight: 500; }
  .tarefa.feita .t { color: var(--apagado); text-decoration: line-through; }
  .tarefa .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .tarefa .quando { font: 500 12.5px/1.6 var(--mono); color: var(--suave); white-space: nowrap; }
  .tarefa .quando.atrasada { color: var(--mal); }
  .espacos-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 16px; }
  .espaco-card { padding: 0; overflow: hidden; }
  .espaco-card .topo-cor { height: 3px; background: var(--cor); opacity: .9; }
  .espaco-card .corpo { padding: 14px 16px 12px; }
  .espaco-card h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .espaco-card .resumo { color: var(--suave); font-size: 13.5px; margin-top: 4px; }
  .fonte-item { display: flex; align-items: baseline; gap: 10px; padding: 7px 16px; border-top: 1px solid var(--fio); font-size: 13.5px; }
  .fonte-item b { font: 600 15px/1 var(--mono); min-width: 34px; text-align: right; }
  .fonte-item.urgente b { color: var(--aviso); }
  .fonte-item span { flex: 1; color: var(--suave); }
  .fonte-item a { color: var(--acento); font-size: 12.5px; }
  .fonte-erro { padding: 8px 16px; border-top: 1px solid var(--fio); color: var(--mal); font-size: 13px; }

  /* ---------- Caixa ---------- */
  .caixa { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: 100vh; }
  .lista { min-width: 0; border-right: 1px solid var(--fio); display: flex; flex-direction: column; min-height: 0; background: color-mix(in srgb, var(--lado) 50%, transparent); }
  .lista-cab { padding: 20px 16px 12px; border-bottom: 1px solid var(--fio); display: flex; flex-direction: column; gap: 12px; }
  .lista-cab h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; justify-content: space-between; }
  .lista-cab .segmento { width: 100%; }
  .lista-cab .segmento button { flex: 1; justify-content: center; padding: 6px 4px; }
  .itens { overflow: auto; flex: 1; }
  .item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--fio); position: relative; }
  .item:hover { background: rgba(255,255,255,.025); }
  .item[aria-current] { background: var(--sup2); }
  .item[aria-current]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acento); }
  .item .txt { flex: 1; min-width: 0; }
  .item .l1 { display: flex; gap: 8px; align-items: baseline; }
  .item .nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .item .hora { font: 500 11.5px/1 var(--mono); color: var(--apagado); white-space: nowrap; }
  .item .prev { color: var(--suave); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .item .prev b { color: var(--apagado); font-weight: 500; }
  .item .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .atalhos-dica { padding: 10px 16px; border-top: 1px solid var(--fio); color: var(--apagado); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .conversa { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .conv-cab { padding: 14px 22px; border-bottom: 1px solid var(--fio); display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: color-mix(in srgb, var(--chao) 70%, transparent); backdrop-filter: blur(12px); }
  .conv-cab .quem { flex: 1; min-width: 200px; display: flex; gap: 12px; align-items: center; }
  .conv-cab h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .conv-cab .sub { color: var(--suave); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .conv-cab .sub select { width: auto; padding: 1px 26px 1px 8px; font-size: 12.5px; border-radius: 999px; background-color: var(--sup2); background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%; }
  .acoes-conv { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .voltar { display: none; }
  .so-movel { display: none; }
  .fio-msgs { flex: 1; overflow: auto; padding: 22px 22px 10px; display: flex; flex-direction: column; gap: 6px; }
  .dia { align-self: center; font: 500 11.5px/1 var(--mono); color: var(--apagado); padding: 5px 10px; border-radius: 999px; background: var(--sup); border: 1px solid var(--fio); margin: 12px 0 6px; }
  .bolha { max-width: min(640px, 82%); padding: 9px 13px 7px; border-radius: 14px; background: var(--sup2); border: 1px solid var(--fio);
    align-self: flex-start; border-bottom-left-radius: 5px; }
  .bolha.minha { align-self: flex-end; background: color-mix(in srgb, var(--acento) 13%, var(--sup2)); border-color: color-mix(in srgb, var(--acento) 22%, transparent);
    border-bottom-left-radius: 14px; border-bottom-right-radius: 5px; }
  .bolha .autor { font-size: 12px; color: var(--acento); font-weight: 500; margin-bottom: 2px; }
  .bolha .assunto { font-weight: 600; margin-bottom: 4px; }
  .bolha .texto { white-space: pre-wrap; overflow-wrap: anywhere; }
  .bolha .texto.longo { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .bolha .hr { font: 500 11px/1 var(--mono); color: var(--apagado); text-align: right; margin-top: 4px; }
  .bolha .mais { border: 0; background: none; color: var(--acento); padding: 4px 0 0; font-size: 13px; }
  .apagado { color: var(--apagado); font-style: italic; }
  .conv-pe { border-top: 1px solid var(--fio); padding: 12px 22px 16px; display: grid; gap: 8px; }
  .conv-pe textarea { min-height: 44px; height: 44px; background: color-mix(in srgb, var(--aviso) 6%, var(--sup)); border-color: color-mix(in srgb, var(--aviso) 18%, var(--fio2)); }
  .conv-pe textarea:focus { height: 96px; }
  .conv-pe .dica { color: var(--apagado); font-size: 12.5px; display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .nada-aberto { flex: 1; display: grid; place-items: center; text-align: center; color: var(--apagado); padding: 40px; }
  .nada-aberto .ico { width: 42px; height: 42px; stroke-width: 1.3; color: var(--fio2); margin-bottom: 10px; }
  .nada-aberto b { display: block; color: var(--suave); font-size: 16px; font-weight: 500; margin-bottom: 4px; }

  /* ---------- Listas e gaveta ---------- */
  .ferramentas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .ferramentas .buscar { flex: 1; min-width: 200px; max-width: 360px; }
  .grupo-tit { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font: 500 11.5px/1 var(--mono); letter-spacing: .06em;
    text-transform: uppercase; color: var(--apagado); background: rgba(255,255,255,.015); border-top: 1px solid var(--fio); }
  .grupo-tit:first-child { border-top: 0; }
  .grupo-tit.mal { color: var(--mal); }
  .pessoas-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .pessoa { padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .pessoa:hover { border-color: var(--fio2); }
  .pessoa h3 { margin: 0; font-size: 15px; }
  .pessoa .canais { color: var(--suave); font-size: 13px; margin-top: 3px; display: grid; gap: 1px; }
  .pessoa .canais span { display: flex; gap: 6px; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pessoa .canais .ico { width: 13px; height: 13px; color: var(--apagado); }
  .pessoa .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .gaveta { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end; }
  .gaveta-fundo { position: absolute; inset: 0; background: rgba(3,5,8,.6); backdrop-filter: blur(2px); }
  .gaveta-painel { position: relative; width: min(520px, 100%); height: 100%; overflow: auto; background: var(--lado); border-left: 1px solid var(--fio2);

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = '') => `<svg class="ico ${cls}"><use href="#i-${n}"/></svg>`;
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const FUSO = 'America/Sao_Paulo';
const diaIso = (d = new Date()) => d.toLocaleDateString('en-CA', { timeZone: FUSO });
const hojeIso = () => diaIso();
const somarDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return diaIso(d); };
const dataCurta = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: FUSO });
const quando = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: FUSO });
// Hora na lista: hoje mostra a hora; ontem, "ontem"; antes, a data.
function horaLista(iso) {
  const d = diaIso(new Date(iso));
  if (d === hojeIso()) return hora(iso);
  if (d === somarDias(-1)) return 'ontem';
  return dataCurta(d);
}
// Há quanto tempo a pessoa espera: é isso que decide quem vem primeiro.
function espera(iso) {
  const min = Math.max(0, (Date.now() - Date.parse(iso)) / 60e3);
  const txt = min < 1 ? 'agora' : min < 60 ? `${Math.round(min)} min` : min < 1440 ? `${Math.round(min / 60)} h` : `${Math.round(min / 1440)} d`;
  return { txt, cls: min >= 1440 ? 'velha' : min >= 240 ? 'morna' : '' };
}
function nomeDia(d) {
  if (d === hojeIso()) return 'Hoje';
  if (d === somarDias(-1)) return 'Ontem';
  const s = new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  return s[0].toUpperCase() + s.slice(1);
}
const NOME_STATUS = { 'a-fazer': 'A fazer', fazendo: 'Fazendo', aguardando: 'Aguardando', feito: 'Feito', cancelado: 'Cancelado' };
const TIPOS_CANAL = { email: 'E-mail', whatsapp: 'WhatsApp', telefone: 'Telefone', outro: 'Outro' };
const NOME_ESTADO = { responder: 'Responder', esperando: 'Esperando', resolvida: 'Resolvidas', arquivada: 'Arquivadas' };
// 5562999990000 -> +55 62 99999-0000 (só para mostrar; o banco guarda os dígitos).
const fone = (d) => { const m = String(d).match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m ? `+55 ${m[1]} ${m[2]}-${m[3]}` : d; };
const iniciais = (n) => String(n || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase() || '?';

const D = { hoje: null, espacos: [], todosEspacos: [], tarefas: null, pessoas: null, conversas: null, conversa: null,
  contas: null, tokens: null, sessoes: null, conectores: null, busca: null, vocab: { status: [], estados: [] }, erro: null };
const UI = { aba: 'hoje', espaco: 'todos', filtro: 'abertas', estado: 'responder', busca: '', buscaTudo: '', conversa: null, tokenNovo: null, gaveta: null };
const ABAS = ['hoje', 'caixa', 'tarefas', 'pessoas', 'espacos', 'conexoes', 'busca'];

// Caminhos relativos à página: a Central funciona tanto na raiz de um domínio quanto em /central/.
async function api(metodo, caminho, corpo) {
  const r = await fetch(caminho.slice(1), { method: metodo, headers: corpo ? { 'Content-Type': 'application/json', 'X-Central': '1' } : { 'X-Central': '1' },
    body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !caminho.startsWith('/api/entrar') && !caminho.startsWith('/api/convite')) { mostrarEntrada(); throw new Error('sessão encerrada'); }
  if (!r.ok) throw new Error(j.erro || `HTTP ${r.status}`);
  return j;
}
const espacoPor = (id) => D.todosEspacos.find((e) => e.id === id) || { id, nome: id, cor: '#888888' };
const cor = (id) => `--cor:${esc(espacoPor(id).cor)}`;
const chipEspaco = (id) => `<span class="chip"><span class="bolinha" style="${cor(id)}"></span>${esc(espacoPor(id).nome)}</span>`;
const nomeConversa = (c) => c.pessoa_nome || (c.canal === 'whatsapp' ? (c.titulo || fone(c.endereco)) : (c.ultima?.autor || c.titulo || c.endereco));
const avatar = (nome, espaco, canal, g) => `<div class="avatar${g ? ' g' : ''}" style="${cor(espaco)}">${esc(iniciais(nome))}${canal ? `<span class="canal ${canal}">${ico(canal === 'email' ? 'email' : 'whatsapp')}</span>` : ''}</div>`;

// ---------- Avisos (com desfazer) ----------
function avisar(texto, { erro = false, acao, fn, ms = 5000 } = {}) {
  const el = document.createElement('div');
  el.className = 'aviso-t' + (erro ? ' erro' : '');
  el.innerHTML = `<span>${esc(texto)}</span>${acao ? `<button>${esc(acao)}</button>` : ''}`;
  if (acao) el.querySelector('button').onclick = () => { el.remove(); fn(); };
  $('#avisos').append(el);
  setTimeout(() => el.remove(), ms);
}
const falhou = (er) => avisar(er.message, { erro: true });

// ---------- Navegação ----------
function contagens() {
  const h = D.hoje?.espacos || [];
  const doEspaco = (e) => UI.espaco === 'todos' || e.espaco.id === UI.espaco;
  return {
    responder: h.filter(doEspaco).reduce((a, e) => a + e.conversas.responder, 0),
    esperando: h.filter(doEspaco).reduce((a, e) => a + e.conversas.esperando, 0),
    atrasadas: h.filter(doEspaco).reduce((a, e) => a + e.vencidas.length, 0),
    hoje: h.filter(doEspaco).reduce((a, e) => a + e.deHoje.length, 0),
    porEspaco: Object.fromEntries(h.map((e) => [e.espaco.id, e.conversas.responder])),
  };
}
function desenharNav() {
  const c = contagens();
  const tarefasN = c.atrasadas + c.hoje;
  const itens = [['hoje', 'Hoje', 'hoje', ''], ['caixa', 'Caixa', 'caixa', c.responder], ['tarefas', 'Tarefas', 'tarefas', tarefasN], ['pessoas', 'Pessoas', 'pessoas', '']];
  $('#nav').innerHTML = itens.map(([id, nome, i, n]) => `<button class="nav-item" data-ir="${id}" ${UI.aba === id ? 'aria-current="page"' : ''}>${ico(i)}${nome}${n ? `<span class="n${id === 'caixa' ? ' quente' : ''}">${n}</span>` : ''}</button>`).join('');
  $('#nav-espacos').innerHTML = [{ id: 'todos', nome: 'Todos' }, ...D.espacos].map((e) => `<button class="nav-item" data-espaco="${esc(e.id)}" ${UI.espaco === e.id ? 'aria-current="true"' : ''}>
      ${e.id === 'todos' ? ico('camadas') : `<span class="bolinha" style="${cor(e.id)};margin:0 4.5px"></span>`}${esc(e.nome)}${(e.id === 'todos' ? c.responder : c.porEspaco[e.id]) ? `<span class="n">${e.id === 'todos' ? c.responder : c.porEspaco[e.id]}</span>` : ''}</button>`).join('');
  $('#abas-movel').innerHTML = [...itens, ['mais', 'Mais', 'conexao', '']].map(([id, nome, i, n]) => `<button data-ir="${id === 'mais' ? 'conexoes' : id}" ${UI.aba === id || (id === 'mais' && ['conexoes', 'espacos'].includes(UI.aba)) ? 'aria-current="page"' : ''}>${ico(i)}${nome}${n && id === 'caixa' ? `<span class="n">${n}</span>` : ''}</button>`).join('');
}
function ir(aba, { conversa = null } = {}) {
  UI.aba = aba; UI.conversa = conversa;
  if (!conversa || String(D.conversa?.id) !== String(conversa)) D.conversa = null;
  history.replaceState(null, '', aba === 'hoje' ? location.pathname : '#' + aba + (conversa ? '/' + conversa : ''));
  fecharGaveta();
  desenharNav();
  desenhar();
  carregarAba();
  scrollTo({ top: 0 });
}

async function carregarBase() {
  try {
    [D.espacos, D.todosEspacos, D.vocab, D.hoje] = await Promise.all([api('GET', '/api/espacos'), api('GET', '/api/espacos?todos'), api('GET', '/api/vocabulario'), api('GET', '/api/hoje')]);
    UI.hojeEm = Date.now();
  } catch (e) { D.erro = e.message; }
  desenharNav();
}
async function carregarAba(forcar) {
  const qs = UI.espaco === 'todos' ? '' : `espaco=${encodeURIComponent(UI.espaco)}`;
  try {
    if (UI.aba === 'hoje') { D.hoje = await api('GET', '/api/hoje' + (forcar ? '?forcar' : '')); UI.hojeEm = Date.now(); desenharNav(); }
    if (UI.aba === 'tarefas' || UI.aba === 'hoje') D.tarefas = await api('GET', `/api/tarefas?${qs}${UI.filtro === 'todas' ? '&todas' : ''}`);
    if (UI.aba === 'pessoas' || UI.aba === 'tarefas') D.pessoas = await api('GET', `/api/pessoas?${qs}${UI.busca ? '&q=' + encodeURIComponent(UI.busca) : ''}`);
    if (UI.aba === 'caixa') {
      D.conversas = await api('GET', `/api/conversas?${qs}&estado=${UI.estado}`);
      D.conversa = UI.conversa ? await api('GET', `/api/conversas/${UI.conversa}`).catch(() => null) : null;
    }
    if (UI.aba === 'conexoes') [D.contas, D.tokens, D.sessoes, D.conectores] = await Promise.all([api('GET', '/api/contas'), api('GET', '/api/tokens'), api('GET', '/api/sessoes'), api('GET', '/api/conectores')]);
    if (UI.aba === 'busca') D.busca = await api('GET', `/api/busca?q=${encodeURIComponent(UI.buscaTudo)}`);
    D.erro = null;
  } catch (e) { D.erro = e.message; }
  desenhar();
}
const faixaErro = () => D.erro ? `<div class="erro-faixa">${ico('alerta')} ${esc(D.erro)}</div>` : '';
function desenhar() {
  const f = { hoje: desenharHoje, caixa: desenharCaixa, tarefas: desenharTarefas, pessoas: desenharPessoas, espacos: desenharEspacos, conexoes: desenharConexoes, busca: desenharBusca }[UI.aba];
  $('#conteudo').innerHTML = f();
  if (UI.aba === 'caixa') { const m = $('.fio-msgs'); if (m) m.scrollTop = m.scrollHeight; }
}

// ---------- Hoje ----------
function saudacao() {
  const h = Number(new Date().toLocaleString('pt-BR', { hour: 'numeric', hour12: false, timeZone: FUSO }));
  return h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}
function desenharHoje() {
  const h = D.hoje;
  if (!h) return `<div class="pagina">${faixaErro() || '<div class="vazio">Montando o seu dia…</div>'}</div>`;
  const c = contagens();
  const doEspaco = (e) => UI.espaco === 'todos' || e.espaco.id === UI.espaco;
  const esp = h.espacos.filter(doEspaco);
  const data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: FUSO });
  const fila = esp.flatMap((e) => e.conversas.primeiras).sort((a, b) => a.ultima_em.localeCompare(b.ultima_em)).slice(0, 8);
  const tarefas = esp.flatMap((e) => [...e.vencidas, ...e.deHoje]);
  const numero = (n, rotulo, icone, alvo, classe) => `<button class="numero toque ${n ? classe : 'zero'}" ${alvo}>${ico(icone)}<b>${n}</b><span>${rotulo}</span></button>`;
  const resumo = c.responder || tarefas.length
    ? `${c.responder ? plural(c.responder, 'pessoa espera', 'pessoas esperam') + ' resposta' : 'Ninguém esperando resposta'}${tarefas.length ? ` e ${plural(tarefas.length, 'tarefa é', 'tarefas são')} para hoje` : ''}.`
    : 'Tudo em dia. Nada pedindo você agora.';
  return `<div class="pagina">
    <div class="cab"><div><h1>${saudacao()}${D.vocab.nome ? ', ' + esc(D.vocab.nome.split(' ')[0]) : ''}.</h1><p>${data[0].toUpperCase() + data.slice(1)} · ${resumo}</p></div>
      <button class="btn fantasma" data-atualizar title="Ler tudo de novo">${ico('atualizar')}Atualizar</button></div>
    ${faixaErro()}
    <div class="numeros">
      ${numero(c.responder, 'para responder', 'caixa', 'data-ir-caixa="responder"', 'quente')}
      ${numero(c.esperando, 'esperando o outro lado', 'relogio', 'data-ir-caixa="esperando"', '')}
      ${numero(c.atrasadas, 'tarefas atrasadas', 'alerta', 'data-ir="tarefas"', 'alerta')}
      ${numero(c.hoje, 'tarefas para hoje', 'calendario', 'data-ir="tarefas"', '')}
    </div>
    <div class="duas">
      <section class="cartao"><div class="cartao-cab"><h2>${ico('caixa')}Quem espera resposta</h2><small>mais antigo primeiro</small></div>
        ${fila.map((x) => { const t = espera(x.ultima_em); return `<div class="fila-item toque" data-abrir-conversa="${x.id}" data-estado-conversa="responder">
          ${avatar(nomeConversa(x), x.espaco_id, x.canal)}
          <div class="txt"><div class="nome"><span>${esc(nomeConversa(x))}</span></div><div class="prev">${esc(x.ultima?.texto || x.ultima?.assunto || x.titulo || '')}</div></div>
          <span class="idade ${t.cls}">${t.txt}</span></div>`; }).join('')
          || `<div class="vazio"><b>Caixa zerada</b>Quando alguém escrever, aparece aqui.</div>`}
        ${c.responder > fila.length ? `<div class="fila-item toque" data-ir-caixa="responder" style="justify-content:center;color:var(--acento);font-size:14px">Ver as ${c.responder} na caixa</div>` : ''}
      </section>
      <section class="cartao"><div class="cartao-cab"><h2>${ico('tarefas')}Tarefas de hoje</h2><small>${tarefas.length || ''}</small></div>
        ${formRapida()}
        ${tarefas.map(linhaTarefa).join('') || `<div class="vazio"><b>Nada para hoje</b>Escreva acima e aperte Enter para criar.</div>`}
      </section>
    </div>
    <div class="espacos-grade">${esp.map(cartaoEspaco).join('')}</div>
  </div>`;
}
function cartaoEspaco(e) {
  const r = e.conversas.responder;
  const fontes = e.fontes.flatMap((f) => [...f.itens].sort((a, b) => b.urgente - a.urgente).map((i) => ({ ...i, fonte: f.nome })));
  return `<section class="cartao espaco-card" style="${cor(e.espaco.id)}"><div class="topo-cor"></div>
    <div class="corpo toque" data-espaco="${esc(e.espaco.id)}"><h3><span class="bolinha"></span>${esc(e.espaco.nome)}</h3>
      <div class="resumo">${r ? `<b style="color:var(--tinta)">${plural(r, 'para responder', 'para responder')}</b> · ` : ''}${plural(e.abertas, 'tarefa aberta', 'tarefas abertas')}${e.vencidas.length ? ` · <span style="color:var(--mal)">${e.vencidas.length} atrasada${e.vencidas.length > 1 ? 's' : ''}</span>` : ''}</div></div>
    ${fontes.map((i) => `<div class="fonte-item ${i.urgente ? 'urgente' : ''}"><b>${i.qtd ?? ''}</b><span>${esc(i.titulo)}</span>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">abrir ↗</a>` : ''}</div>`).join('')}
    ${e.fontes.filter((f) => f.erro).map((f) => `<div class="fonte-erro">${esc(f.nome)}: ${esc(f.erro)}</div>`).join('')}
  </section>`;
}
function formRapida() {
  const padrao = UI.espaco !== 'todos' ? UI.espaco : D.espacos[0]?.id;
  return `<form class="rapida" data-rapida>
    <input name="titulo" placeholder="Nova tarefa… (Enter cria)" required maxlength="200" aria-label="Nova tarefa" autocomplete="off">
    <select name="espaco" aria-label="Espaço">${D.espacos.map((e) => `<option value="${esc(e.id)}" ${e.id === padrao ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>
    <select name="proxima" aria-label="Quando"><option value="${hojeIso()}">hoje</option><option value="${somarDias(1)}">amanhã</option><option value="${somarDias(7)}">+7 dias</option><option value="">sem data</option></select>
  </form>`;
}

// ---------- Tarefas ----------
function linhaTarefa(t) {
  const hoje = hojeIso();
  const atrasada = t.proxima && t.proxima < hoje && !t.concluido;
  return `<div class="tarefa ${t.concluido ? 'feita' : ''}">
    <button class="marcar ${t.concluido ? 'feito' : ''}" data-concluir="${t.id}" title="${t.concluido ? 'Reabrir' : 'Concluir'}" aria-label="${t.concluido ? 'Reabrir' : 'Concluir'}">${ico('check')}</button>

      <div class="meta">${UI.espaco === 'todos' ? chipEspaco(t.espaco_id) : ''}${t.status !== 'a-fazer' && !t.concluido ? `<span class="chip">${NOME_STATUS[t.status]}</span>` : ''}${t.pessoa_nome ? `<span class="chip">${ico('pessoas')} ${esc(t.pessoa_nome)}</span>` : ''}${t.anotacoes.length ? `<span class="chip">${ico('nota')} ${t.anotacoes.length}</span>` : ''}${t.origem ? `<span class="chip">${esc(t.origem)}</span>` : ''}</div></div>
    <span class="quando ${atrasada ? 'atrasada' : ''}">${t.proxima ? (t.proxima === hoje ? 'hoje' : t.proxima === somarDias(1) ? 'amanhã' : dataCurta(t.proxima)) : ''}</span>
  </div>`;
}
function desenharTarefas() {
  const ts = D.tarefas;
  if (!ts) return `<div class="pagina">${faixaErro() || '<div class="vazio">Carregando…</div>'}</div>`;
  const hoje = hojeIso();
  const grupos = [
    ['Atrasadas', ts.filter((t) => t.proxima && t.proxima < hoje && !t.concluido), 'mal'],
    ['Hoje', ts.filter((t) => t.proxima === hoje && !t.concluido)],
    ['Próximos dias', ts.filter((t) => t.proxima && t.proxima > hoje && !t.concluido)],
    ['Sem data', ts.filter((t) => !t.proxima && !t.concluido)],
    ['Concluídas', ts.filter((t) => t.concluido)],
  ].filter(([, l]) => l.length);
  const abertas = ts.filter((t) => !t.concluido).length;
  return `<div class="pagina">
    <div class="cab"><div><h1>Tarefas</h1><p>${plural(abertas, 'aberta', 'abertas')}${UI.espaco === 'todos' ? ' em todos os espaços' : ' em ' + esc(espacoPor(UI.espaco).nome)}. Marque a caixinha para concluir; clique no texto para detalhar.</p></div>
      <div class="segmento"><button data-filtro="abertas" aria-pressed="${UI.filtro === 'abertas'}">Abertas</button><button data-filtro="todas" aria-pressed="${UI.filtro === 'todas'}">Com concluídas</button></div></div>
    ${faixaErro()}
    <section class="cartao">${formRapida()}
      ${grupos.map(([titulo, lista, cls]) => `<div class="grupo-tit ${cls || ''}"><span>${titulo}</span><span>${lista.length}</span></div>${lista.map(linhaTarefa).join('')}`).join('')
        || '<div class="vazio"><b>Nenhuma tarefa</b>Escreva acima e aperte Enter.</div>'}
    </section>

}
function gavetaTarefa(t) {

  return `<div class="gaveta-cab"><h2>Tarefa</h2><button class="btn fantasma" data-fechar aria-label="Fechar">${ico('fechar')}</button></div>
  <form class="form" data-form-tarefa="${t.id}">
    <div>${chipEspaco(t.espaco_id)} <span class="pequeno">criada ${quando(t.criado)}${t.concluido ? ` · concluída ${quando(t.concluido)}` : ''}</span></div>
    <label>O que fazer<input name="titulo" value="${esc(t.titulo)}" maxlength="200"></label>
    <div><label>Situação</label><div class="opcoes">${D.vocab.status.map((s) => `<button type="button" data-opcao="status" data-valor="${s}" aria-pressed="${s === t.status}">${NOME_STATUS[s]}</button>`).join('')}</div><input type="hidden" name="status" value="${esc(t.status)}"></div>
    <div><label>Quando</label><div class="opcoes">
      ${[['hoje', hojeIso()], ['amanhã', somarDias(1)], ['+3 dias', somarDias(3)], ['+7 dias', somarDias(7)], ['sem data', '']].map(([n, v]) => `<button type="button" data-opcao="proxima" data-valor="${v}" aria-pressed="${(t.proxima || '') === v}">${n}</button>`).join('')}</div>

    ${t.anotacoes.length ? `<div class="historico">${t.anotacoes.map((n) => `<div><time>${quando(n.em)}<button type="button" data-apagar-anotacao="${n.id}" data-da-tarefa="${t.id}">apagar</button></time>${esc(n.texto)}</div>`).join('')}</div>` : ''}
  </form>`;
}

// ---------- Caixa ----------
function desenharCaixa() {
  const cs = D.conversas;
  const c = D.conversa;
  const n = contagens();
  const lista = !cs ? '<div class="vazio">Carregando…</div>' : cs.map((x) => `<div class="item toque" data-abrir-conversa="${x.id}" ${String(UI.conversa) === String(x.id) ? 'aria-current="true"' : ''}>

    </div>`).join('') || `<div class="vazio"><b>${UI.estado === 'responder' ? 'Nada para responder' : 'Vazio'}</b>${UI.estado === 'responder' ? 'Você está em dia nesta caixa.' : ''}</div>`;

  </div>`;
}
function painelConversa(c) {
  const nome = nomeConversa(c);
  const r = c.responder;
  const dias = [];
  for (const m of c.mensagens) {
    const d = diaIso(new Date(m.em));
    if (!dias.length || dias.at(-1).d !== d) dias.push({ d, ms: [] });
    dias.at(-1).ms.push(m);
  }
  const bolha = (m) => {
    const longo = (m.texto || '').length > 700;
    return `<div class="bolha ${m.de_mim ? 'minha' : ''}">
      ${!m.de_mim && c.canal === 'email' && m.autor ? `<div class="autor">${esc(m.autor)}</div>` : ''}
      ${m.assunto && c.canal === 'email' ? `<div class="assunto">${esc(m.assunto)}</div>` : ''}
      <div class="texto ${longo ? 'longo' : ''}">${m.texto ? esc(m.texto) : '<span class="apagado">texto apagado pela retenção ou sem texto</span>'}</div>
      ${longo ? '<button class="mais" data-ler-tudo>ler tudo</button>' : ''}
      <div class="hr">${hora(m.em)}</div></div>`;
  };
  const resolvida = c.estado === 'resolvida';
  return `<div class="conv-cab">
      <button class="btn fantasma voltar" data-fechar-conversa aria-label="Voltar">${ico('voltar')}</button>
      <div class="quem">${avatar(nome, c.espaco_id, c.canal, true)}
        <div style="min-width:0"><h2>${esc(nome)}</h2>
          <div class="sub"><span>${c.canal === 'email' ? 'E-mail' : 'WhatsApp'}${c.endereco ? ' · ' + esc(c.canal === 'email' ? c.endereco : fone(c.endereco)) : ''}</span>
            <select data-mover aria-label="Espaço da conversa" style="${cor(c.espaco_id)}">${D.espacos.map((e) => `<option value="${esc(e.id)}" ${e.id === c.espaco_id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>
            ${c.pessoa_id ? '' : `<button class="btn mini fantasma" data-cadastrar-pessoa>${ico('pessoa-mais')}cadastrar</button>`}</div></div></div>
      <div class="acoes-conv">
        ${r ? `<a class="btn ${r.app === 'WhatsApp' ? 'wa' : 'primario'}" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" data-responder>${ico(r.app === 'WhatsApp' ? 'whatsapp' : 'email')}Responder no ${esc(r.app)}<span class="kbd">R</span></a>` : ''}
        ${resolvida ? `<button class="btn" data-mudar-estado="responder">${ico('atualizar')}Reabrir</button>` : `<button class="btn" data-mudar-estado="resolvida">${ico('check')}Resolvido<span class="kbd">E</span></button>`}
        <button class="btn fantasma secundaria" data-mudar-estado="esperando" ${c.estado === 'esperando' ? 'hidden' : ''}>${ico('relogio')}Esperando</button>
        ${c.tarefa_id ? '' : `<button class="btn fantasma secundaria" data-virar-tarefa>${ico('tarefas')}Virar tarefa</button>`}
        <button class="btn fantasma secundaria" data-mudar-estado="arquivada" title="Arquivar">${ico('arquivo')}<span class="so-movel">Arquivar</span></button>
      </div>
    </div>
    <div class="fio-msgs">${dias.map((d) => `<div class="dia">${nomeDia(d.d)}</div>${d.ms.map(bolha).join('')}`).join('')}</div>
    <div class="conv-pe">
      <textarea data-nota placeholder="Nota interna (só você vê)" maxlength="4000">${esc(c.nota)}</textarea>
      <div class="dica"><span>${ico('cadeado')} A Central só lê: para responder, use o botão, que abre o ${esc(r?.app || 'app')} já nesta conversa.</span><span id="nota-salva"></span></div>
    </div>`;
}

// Muda o estado, avisa com "desfazer" e já abre a próxima da fila.
async function mudarEstado(estado) {
  const c = D.conversa; if (!c) return;
  const antes = c.estado, id = c.id;
  const idx = (D.conversas || []).findIndex((x) => x.id === id);
  try { await api('PATCH', `/api/conversas/${id}`, { estado }); } catch (er) { return falhou(er); }
  const proxima = estado !== UI.estado ? (D.conversas[idx + 1] || D.conversas[idx - 1]) : null;
  UI.conversa = estado !== UI.estado ? (matchMedia('(max-width: 900px)').matches ? null : proxima?.id ?? null) : id;
  history.replaceState(null, '', '#caixa' + (UI.conversa ? '/' + UI.conversa : ''));
  avisar(`${esc(nomeConversa(c))}: ${({ resolvida: 'resolvida', esperando: 'esperando o outro lado', arquivada: 'arquivada', responder: 'reaberta' })[estado]}`,
    { acao: 'Desfazer', fn: async () => { try { await api('PATCH', `/api/conversas/${id}`, { estado: antes }); UI.conversa = id; await atualizarContagens(); await carregarAba(); } catch (er) { falhou(er); } } });
  await atualizarContagens();
  await carregarAba();
}
// Os números da barra e das abas vêm do /api/hoje.
async function atualizarContagens() { try { D.hoje = await api('GET', '/api/hoje'); UI.hojeEm = Date.now(); desenharNav(); } catch {} }
async function salvarNota(el) {
  const c = D.conversa; if (!c || el.value === (c.nota || '')) return;
  try { await api('PATCH', `/api/conversas/${c.id}`, { nota: el.value }); c.nota = el.value; const s = $('#nota-salva'); if (s) s.textContent = 'nota salva'; }
  catch (er) { falhou(er); }
}

// "Mozilla/5.0 (Linux; Android 14…) … Chrome/131…" -> "Chrome no Android"
function aparelho(ua = '') {
  const nav = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
  const so = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iPhone' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
  return so ? `${nav} no ${so}` : nav;
}
function estadoWa(c) {
  const e = c.estado || {};
  const visto = e.visto ? Date.now() - Date.parse(e.visto) < 2 * 60e3 : false;
  if (e.restricao) return ['mal', e.restricao];
  if (!visto) return ['mal', 'o processo do WhatsApp não está rodando'];
  if (e.conectado) return ['bom', `conectado${c.endereco ? ' · ' + fone(c.endereco) : ''}`];
  return ['aviso', e.erro || (e.codigo ? 'esperando você digitar o código no celular' : 'desconectado: pareie abaixo')];
}

        <div style="display:flex;gap:8px;flex-wrap:wrap">${c.estado?.conectado ? `<button class="btn perigo" data-wa-desligar="${esc(c.id)}">Desligar</button>` : ''}

  const b = D.busca;
  if (!b) return `<div class="pagina">${faixaErro() || '<div class="vazio">Buscando…</div>'}</div>`;
  const marcar = (t) => esc(t).replace(/\u0002/g, '<mark>').replace(/\u0003/g, '</mark>');
  const total = b.conversas.length + b.tarefas.length + b.pessoas.length;
  return `<div class="pagina busca-res">
    <div class="cab"><div><h1>“${esc(UI.buscaTudo)}”</h1><p>${plural(total, 'resultado', 'resultados')} em mensagens, tarefas e pessoas de todos os espaços.</p></div></div>
    ${faixaErro()}
    <section class="cartao">
    ${b.conversas.length ? `<div class="grupo-tit"><span>Mensagens</span><span>${b.conversas.length}</span></div>${b.conversas.map((c) => `<div class="fila-item toque" data-abrir-conversa="${c.id}" data-estado-conversa="${esc(c.estado)}" data-espaco-conversa="${esc(c.espaco_id)}">
      ${avatar(c.pessoa_nome || c.titulo, c.espaco_id, c.canal)}<div class="txt"><div class="nome"><span>${esc(c.pessoa_nome || c.titulo)}</span></div><div class="prev">${marcar(c.trecho)}</div></div><span class="idade">${horaLista(c.em)}</span></div>`).join('')}` : ''}
    ${b.tarefas.length ? `<div class="grupo-tit"><span>Tarefas</span><span>${b.tarefas.length}</span></div>${b.tarefas.map((t) => `<div class="fila-item toque" data-tarefa="${t.id}"><div class="txt"><div class="nome"><span>${esc(t.titulo)}</span></div><div class="prev">${NOME_STATUS[t.status]}${t.proxima ? ' · ' + dataCurta(t.proxima) : ''}</div></div>${chipEspaco(t.espaco_id)}</div>`).join('')}` : ''}
    ${b.pessoas.length ? `<div class="grupo-tit"><span>Pessoas</span><span>${b.pessoas.length}</span></div>${b.pessoas.map((p) => `<div class="fila-item toque" data-pessoa="${p.id}">${avatar(p.nome, p.espacos?.[0]?.id)}<div class="txt"><div class="nome"><span>${esc(p.nome)}</span></div></div></div>`).join('')}` : ''}
    ${total ? '' : '<div class="vazio"><b>Nada encontrado</b>A busca ignora acentos; tente uma palavra só.</div>'}

// ---------- Gaveta ----------
function abrirGaveta(html) { $('#gaveta-painel').innerHTML = html; $('#gaveta').hidden = false; $('#gaveta-painel input, #gaveta-painel textarea')?.focus(); }
function fecharGaveta() { $('#gaveta').hidden = true; $('#gaveta-painel').innerHTML = ''; UI.gaveta = null; }
async function abrirTarefa(id) {
  try {
    if (!D.pessoas) D.pessoas = await api('GET', '/api/pessoas');
    let t = (D.tarefas || []).find((x) => String(x.id) === String(id));
    if (!t) t = (await api('GET', '/api/tarefas?todas')).find((x) => String(x.id) === String(id));
    if (t) { UI.gaveta = { tipo: 'tarefa', id: t.id }; abrirGaveta(gavetaTarefa(t)); }
  } catch (er) { falhou(er); }
}
async function abrirPessoa(id) {
  try {
    const p = (D.pessoas || []).find((x) => String(x.id) === String(id)) || (await api('GET', '/api/pessoas')).find((x) => String(x.id) === String(id));
    if (p) { UI.gaveta = { tipo: 'pessoa', id: p.id }; abrirGaveta(gavetaPessoa(p)); }
  } catch (er) { falhou(er); }
}

// ---------- Cliques ----------
document.addEventListener('click', async (e) => {
  const alvo = (s) => e.target.closest(s);
  if (alvo('[data-fechar]')) return fecharGaveta();
  if (alvo('a[href]')) return;
  const irPara = alvo('[data-ir]');
  if (irPara) return ir(irPara.dataset.ir);
  if (alvo('[data-ir-caixa]')) { UI.estado = alvo('[data-ir-caixa]').dataset.irCaixa; return ir('caixa'); }
  if (alvo('[data-espaco]') && !alvo('#gaveta')) { UI.espaco = alvo('[data-espaco]').dataset.espaco; UI.conversa = null; desenharNav(); if (UI.aba === 'espacos' || UI.aba === 'conexoes' || UI.aba === 'busca') return ir('hoje'); return carregarAba(); }
  if (alvo('[data-atualizar]')) { avisar('Lendo tudo de novo…', { ms: 2000 }); return carregarAba(true); }
  if (alvo('[data-filtro]')) { UI.filtro = alvo('[data-filtro]').dataset.filtro; return carregarAba(); }
  if (alvo('[data-estado]')) { UI.estado = alvo('[data-estado]').dataset.estado; UI.conversa = null; history.replaceState(null, '', '#caixa'); return carregarAba(); }
  const abrirConv = alvo('[data-abrir-conversa]');
  if (abrirConv) {
    if (abrirConv.dataset.estadoConversa) UI.estado = abrirConv.dataset.estadoConversa === 'arquivada' ? 'resolvida' : abrirConv.dataset.estadoConversa;
    if (abrirConv.dataset.espacoConversa && UI.espaco !== 'todos') UI.espaco = abrirConv.dataset.espacoConversa;
    if (UI.aba !== 'caixa') return ir('caixa', { conversa: abrirConv.dataset.abrirConversa });
    UI.conversa = abrirConv.dataset.abrirConversa;
    history.replaceState(null, '', '#caixa/' + UI.conversa);
    $$('.item').forEach((i) => i.toggleAttribute('aria-current', i.dataset.abrirConversa === UI.conversa));
    try { D.conversa = await api('GET', `/api/conversas/${UI.conversa}`); } catch (er) { falhou(er); }
    return desenhar();
  }
  if (alvo('[data-fechar-conversa]')) { UI.conversa = null; D.conversa = null; history.replaceState(null, '', '#caixa'); return desenhar(); }
  if (alvo('[data-mudar-estado]')) return mudarEstado(alvo('[data-mudar-estado]').dataset.mudarEstado);
  if (alvo('[data-ler-tudo]')) { const b = alvo('.bolha'); b.querySelector('.texto').classList.remove('longo'); alvo('[data-ler-tudo]').remove(); return; }
  if (alvo('[data-virar-tarefa]')) {
    try { const t = await api('POST', `/api/conversas/${D.conversa.id}/tarefa`, {}); avisar('Virou tarefa', { acao: 'Abrir', fn: () => abrirTarefa(t.id) }); } catch (er) { return falhou(er); }
    return carregarAba();
  }
  if (alvo('[data-cadastrar-pessoa]')) {
    const c = D.conversa;
    UI.gaveta = { tipo: 'pessoa', id: null };
    return abrirGaveta(gavetaPessoa({ nome: c.canal === 'email' ? (c.mensagens.find((m) => !m.de_mim)?.autor || '') : (c.titulo || ''), notas: '',
      espacos: [{ id: c.espaco_id }], canais: c.endereco ? [{ tipo: c.canal === 'email' ? 'email' : 'whatsapp', valor: c.endereco }] : [] }));
  }
  const conc = alvo('[data-concluir]');
  if (conc) {
    const id = Number(conc.dataset.concluir);
    const feito = conc.classList.contains('feito');
    conc.classList.toggle('feito', !feito);
    try {
      await api('PATCH', `/api/tarefas/${id}`, { status: feito ? 'a-fazer' : 'feito' });
      if (!feito) avisar('Tarefa concluída', { acao: 'Desfazer', fn: async () => { await api('PATCH', `/api/tarefas/${id}`, { status: 'a-fazer' }).catch(falhou); carregarAba(); atualizarContagens(); } });
    } catch (er) { falhou(er); }
    await carregarAba(); return atualizarContagens();
  }
  const tar = alvo('[data-tarefa]');
  if (tar) return abrirTarefa(tar.dataset.tarefa);
  const pes = alvo('[data-pessoa]');
  if (pes) return abrirPessoa(pes.dataset.pessoa);
  if (alvo('[data-nova-pessoa]')) { UI.gaveta = { tipo: 'pessoa', id: null }; return abrirGaveta(gavetaPessoa({ nome: '', notas: '', espacos: UI.espaco === 'todos' ? [] : [{ id: UI.espaco }], canais: [{ tipo: 'whatsapp', valor: '' }] })); }

  // Dentro da gaveta
  const op = alvo('[data-opcao]');
  if (op) {
    const f = op.closest('form');
    f.querySelector(`[name=${op.dataset.opcao}]`).value = op.dataset.valor;
    $$(`[data-opcao="${op.dataset.opcao}"]`, f).forEach((b) => b.setAttribute('aria-pressed', b === op));
    return;
  }
  const ep = alvo('[data-espaco-pessoa]');
  if (ep) return ep.setAttribute('aria-pressed', ep.getAttribute('aria-pressed') !== 'true');
  if (alvo('[data-mais-canal]')) return alvo('form').querySelector('.lista-canais').insertAdjacentHTML('beforeend', linhaCanal({ tipo: 'whatsapp', valor: '' }));
  if (alvo('[data-tirar-canal]')) return alvo('.canal-linha').remove();
  if (alvo('[data-apagar-anotacao]')) {
    const b = alvo('[data-apagar-anotacao]');
    try { await api('PATCH', `/api/tarefas/${b.dataset.daTarefa}`, { apagarAnotacao: Number(b.dataset.apagarAnotacao) }); } catch (er) { return falhou(er); }
    await carregarAba(); return abrirTarefa(b.dataset.daTarefa);
  }
  if (alvo('[data-apagar-pessoa]')) {
    if (!confirm('Apagar esta pessoa? As tarefas ficam, sem a pessoa.')) return;
    try { await api('DELETE', `/api/pessoas/${UI.gaveta.id}`); } catch (er) { return falhou(er); }
    fecharGaveta(); avisar('Pessoa apagada'); return carregarAba();
  }

  // Conexões
  const acao = async (fn, ok) => { try { await fn(); if (ok) avisar(ok); } catch (er) { falhou(er); } carregarAba(); };
  if (alvo('[data-ler-conta]')) { avisar('Lendo a caixa…', { ms: 2500 }); return acao(() => api('POST', `/api/contas/${alvo('[data-ler-conta]').dataset.lerConta}/ler`, {}), 'Caixa lida'); }
  if (alvo('[data-apagar-conta]')) {
    if (!confirm('Apagar esta conta e as conversas dela na Central? A caixa de verdade não muda.')) return;
    return acao(() => api('DELETE', `/api/contas/${alvo('[data-apagar-conta]').dataset.apagarConta}`), 'Conta apagada');
  }
  if (alvo('[data-wa-desligar]')) {
    if (!confirm('Desligar este WhatsApp da Central? O aparelho sai da lista de conectados.')) return;
    return acao(() => api('POST', `/api/contas/${alvo('[data-wa-desligar]').dataset.waDesligar}/whatsapp`, { acao: 'desligar' }), 'Pedido de desligar enviado');
  }
  if (alvo('[data-token]')) {
    const b = alvo('[data-token]');
    try { UI.tokenNovo = await api('POST', '/api/tokens', { nome: b.dataset.tokenNome, escopo: b.dataset.token }); } catch (er) { return falhou(er); }
    await carregarAba(); scrollTo({ top: 0 }); return;
  }
  if (alvo('[data-revogar]')) {
    if (!confirm('Revogar este token? Quem usa ele para de funcionar na hora.')) return;
    return acao(() => api('DELETE', `/api/tokens/${alvo('[data-revogar]').dataset.revogar}`), 'Token revogado');
  }
  if (alvo('[data-sair-todas]')) {
    if (!confirm('Encerrar todas as sessões, inclusive esta?')) return;
    try { await api('POST', '/api/sessoes/sair-de-todas', {}); } catch {}
    return mostrarEntrada();
  }
});
$('#sair').onclick = async () => { try { await api('POST', '/api/sair', {}); } catch {} mostrarEntrada(); };
$('#busca-topo').onkeydown = (e) => { if (e.key === 'Enter' && e.target.value.trim()) { UI.buscaTudo = e.target.value.trim(); ir('busca'); } };

document.addEventListener('change', async (e) => {
  if (e.target.matches('[data-mover]')) {
    const c = D.conversa, para = e.target.value, de = c.espaco_id;
    try { await api('PATCH', `/api/conversas/${c.id}`, { espaco_id: para }); } catch (er) { return falhou(er); }
    avisar(`Movida para ${espacoPor(para).nome}`, { acao: 'Desfazer', fn: async () => { await api('PATCH', `/api/conversas/${c.id}`, { espaco_id: de }).catch(falhou); carregarAba(); } });
    return carregarAba();
  }
  if (e.target.matches('[name=proxima][type=date]')) $$('[data-opcao="proxima"]', e.target.closest('form')).forEach((b) => b.setAttribute('aria-pressed', b.dataset.valor === e.target.value));
});
document.addEventListener('focusout', (e) => { if (e.target.matches('[data-nota]')) salvarNota(e.target); });
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-nota]')) { clearTimeout(UI.tNota); const s = $('#nota-salva'); if (s) s.textContent = ''; UI.tNota = setTimeout(() => salvarNota(e.target), 1200); }
  if (e.target.matches('[name=busca-pessoas]')) {
    UI.busca = e.target.value; clearTimeout(UI.t);
    UI.t = setTimeout(async () => { await carregarAba(); const b = $('[name=busca-pessoas]'); b?.focus(); b?.setSelectionRange(b.value.length, b.value.length); }, 250);
  }
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.matches('[data-rapida]')) {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    try { await api('POST', '/api/tarefas', { espaco_id: d.espaco, titulo: d.titulo, proxima: d.proxima || null }); } catch (er) { return falhou(er); }
    avisar('Tarefa criada');
    await carregarAba(); atualizarContagens();
    const novo = $('[data-rapida] [name=titulo]'); novo?.focus();
    return;
  }
  if (f.matches('[data-form-tarefa]')) {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    try { await api('PATCH', `/api/tarefas/${f.dataset.formTarefa}`, { titulo: d.titulo, status: d.status, pessoa_id: d.pessoa || null, proxima: d.proxima || null, nota: d.nota }); }
    catch (er) { return falhou(er); }
    fecharGaveta(); avisar('Tarefa salva'); await carregarAba(); return atualizarContagens();
  }
  if (f.matches('[data-form-pessoa]')) {
    e.preventDefault();
    const dados = {
      nome: f.querySelector('[name=nome]').value, notas: f.querySelector('[name=notas]').value,
      espacos: $$('[data-espaco-pessoa][aria-pressed="true"]', f).map((b) => b.dataset.espacoPessoa),
      canais: $$('.canal-linha', f).map((c) => ({ tipo: c.querySelector('select').value, valor: c.querySelector('input').value.trim() })).filter((c) => c.valor),
    };
    try { f.dataset.formPessoa ? await api('PUT', `/api/pessoas/${f.dataset.formPessoa}`, dados) : await api('POST', '/api/pessoas', dados); }
    catch (er) { return falhou(er); }
    fecharGaveta(); avisar('Pessoa salva'); return carregarAba();
  }
  if (f.matches('[data-form-espaco]')) {
    e.preventDefault();
    const v = (n) => f.querySelector(`[name=${n}]`);
    try { await api('POST', '/api/espacos', { id: v('id').value.trim(), nome: v('nome').value, cor: v('cor').value, ordem: Number(v('ordem').value) || 0, arquivado: v('arquivado').checked }); }
    catch (er) { return falhou(er); }
    avisar('Espaço salvo'); return carregarBase().then(desenhar);
  }
  if (f.matches('[data-parear]')) {
    e.preventDefault();
    try { await api('POST', `/api/contas/${f.dataset.parear}/whatsapp`, { acao: 'parear', numero: f.querySelector('[name=numero]').value }); } catch (er) { return falhou(er); }
    avisar('Pedido enviado: o código aparece aqui em alguns segundos'); return carregarAba();
  }
  if (f.matches('[data-form-email], [data-form-wa]')) {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    try { await api('POST', '/api/contas', { ...d, tipo: f.matches('[data-form-email]') ? 'email' : 'whatsapp' }); } catch (er) { return falhou(er); }
    avisar('Conta ligada'); return carregarAba();
  }
});

// Atalhos da caixa (fora de campo de texto).
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#gaveta').hidden) return fecharGaveta();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('#gaveta textarea')) return e.target.closest('form').requestSubmit();
  if (e.target.matches('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey || $('#app').hidden || !$('#gaveta').hidden) return;
  if (e.key === '/') { e.preventDefault(); return $('#busca-topo').focus(); }
  if (UI.aba !== 'caixa') return;
  const lista = D.conversas || [];
  const i = lista.findIndex((x) => String(x.id) === String(UI.conversa));
  const abrir = (x) => x && $(`[data-abrir-conversa="${x.id}"]`)?.click();
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); abrir(lista[i + 1] || (i < 0 ? lista[0] : null)); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); abrir(lista[i - 1]); }
  else if (e.key === 'e' && D.conversa) mudarEstado(D.conversa.estado === 'resolvida' ? 'responder' : 'resolvida');
  else if (e.key === 'r' && D.conversa?.responder) $('[data-responder]')?.click();
  else if (e.key === 't' && D.conversa && !D.conversa.tarefa_id) $('[data-virar-tarefa]')?.click();
  else if (e.key === 'Escape' && D.conversa) $('[data-fechar-conversa]')?.click();
});

// ---------- Entrar e primeiro acesso ----------
function mostrarTela(app) {
  $('#app').hidden = !app;
  $('#entrada').hidden = app;
}
const telaEntrada = (form) => `<div class="entrada-tela">
  <div class="entrada-marca"><div class="marca" style="padding:0">${$('.marca svg').outerHTML}Central</div>
    <div><h1>Tudo o que pede você, <em>num lugar só.</em></h1>
      <ul><li>${ico('caixa')}E-mail e WhatsApp de cada empresa, separados por espaço</li><li>${ico('cadeado')}Só leitura: nada é enviado daqui</li><li>${ico('escudo')}Senha e autenticador do celular</li></ul></div>
    <span class="pequeno">Central pessoal · código aberto</span></div>
  <div class="entrada-form">${form}</div></div>`;
function mostrarEntrada(erro, aviso) {
  mostrarTela(false);
  D.hoje = null;
  // O campo "usuario" escondido existe para o gerenciador de senhas: sem ele, o
  // navegador põe o seu login salvo no campo do código.
  $('#entrada').innerHTML = telaEntrada(`<form class="entrada" data-entrar novalidate>
    <h2>Entrar</h2><p>${esc(aviso || 'Sua senha e o código de 6 números do app autenticador.')}</p>
    <input name="usuario" autocomplete="username" value="central" hidden>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required autofocus></label>
    <label>Código do autenticador<input class="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000"></label>
    <button class="btn primario">Entrar</button>
    ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
  </form>`);
}
// Central sem dono: não adianta pedir senha. Pede o convite (link inteiro ou só o código).
function mostrarPrimeiroAcesso(erro) {
  mostrarTela(false);
  $('#entrada').innerHTML = telaEntrada(`<form class="entrada" data-primeiro novalidate>
    <h2>Primeiro acesso</h2><p>A Central ainda não tem senha. Cole o link de convite que você recebeu (ou só o código que começa com <b>cvt_</b>).</p>
    <label>Convite<input name="convite" autocomplete="off" spellcheck="false" placeholder="https://…/#convite=cvt_…" required autofocus></label>
    <button class="btn primario">Continuar</button>
    ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
  </form>`);
}
const codigoLimpo = (v) => String(v || '').replace(/\s/g, '');
function mostrarConvite(convite, passo = 1, dados = {}, erro) {
  mostrarTela(false);
  $('#entrada').innerHTML = telaEntrada(passo === 1 ? `<form class="entrada" data-convite-1>
      <h2>Crie a sua senha</h2><p>Passo 1 de 2. Ela fica só com você: nem quem criou o convite vê.</p>
      <label>Senha (12 caracteres ou mais)<input name="senha" type="password" autocomplete="new-password" minlength="12" required autofocus></label>
      <label>Repita a senha<input name="senha2" type="password" autocomplete="new-password" minlength="12" required></label>
      <button class="btn primario">Continuar</button>
      ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
    </form>` : `<form class="entrada" data-convite-2>
      <h2>Ligue o autenticador</h2><p>Passo 2 de 2. No Google Authenticator (ou Aegis, 1Password), toque em <b>+</b> e leia o QR:</p>
      <div class="qr">${dados.qr || ''}</div>
      <p class="pequeno">Sem câmera? “Inserir chave de configuração” e digite:</p>
      <div class="segredo">${esc(dados.segredo.match(/.{1,4}/g).join(' '))}</div>
      <label>Código de 6 números que o app mostra<input class="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required autofocus></label>
      <button class="btn primario">Ativar</button>
      ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
    </form>`);
  $('#entrada').dataset.convite = convite;
  UI.conviteDados = dados;
}

document.addEventListener('submit', async (e) => {
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));
  if (f.matches('[data-primeiro]')) {
    e.preventDefault();
    const c = String(d.convite || '').match(/cvt_[\w-]{20,}/)?.[0];
    return c ? mostrarConvite(c) : mostrarPrimeiroAcesso('Não achei o convite aí. Ele começa com cvt_.');
  }
  if (f.matches('[data-entrar]')) {
    e.preventDefault();
    d.codigo = codigoLimpo(d.codigo);
    if (!d.senha) return mostrarEntrada('Digite a senha.');
    if (!/^[0-9]{6}$/.test(d.codigo)) return mostrarEntrada('O código são os 6 números que aparecem no app autenticador (Google Authenticator, Aegis…), não o seu usuário.');
    try { await api('POST', '/api/entrar', { senha: d.senha, codigo: d.codigo }); iniciarApp(); } catch (er) { /configurada/.test(er.message) ? mostrarPrimeiroAcesso() : mostrarEntrada(er.message); }
  }
  if (f.matches('[data-convite-1]')) {
    e.preventDefault();
    const convite = $('#entrada').dataset.convite;
    if (d.senha !== d.senha2) return mostrarConvite(convite, 1, {}, 'As duas senhas não são iguais.');
    try { mostrarConvite(convite, 2, await api('POST', '/api/convite/abrir', { convite, senha: d.senha })); } catch (er) { mostrarConvite(convite, 1, {}, er.message); }
  }
  if (f.matches('[data-convite-2]')) {
    e.preventDefault();
    const convite = $('#entrada').dataset.convite;
    try {
      await api('POST', '/api/convite/ativar', { convite, codigo: codigoLimpo(d.codigo) });
      history.replaceState(null, '', location.pathname);
      mostrarEntrada(null, 'Pronto. Agora entre com a senha e um código novo do autenticador.');
    } catch (er) { mostrarConvite(convite, 2, UI.conviteDados, er.message); }
  }
});

async function iniciarApp() {
  mostrarTela(true);
  const [aba, conversa] = location.hash.slice(1).split('/');
  UI.aba = ABAS.includes(aba) && aba !== 'busca' ? aba : 'hoje';
  UI.conversa = UI.aba === 'caixa' && /^\d+$/.test(conversa || '') ? conversa : null;
  desenharNav();
  $('#conteudo').innerHTML = '<div class="pagina"><div class="vazio">Carregando…</div></div>';
  await carregarBase();
  await carregarAba();
}

(async () => {
  const convite = location.hash.match(/^#convite=(cvt_[\w-]+)$/)?.[1];
  // O convite sai da barra de endereço na hora (não fica no histórico nem em print).
  if (convite) { history.replaceState(null, '', location.pathname); return mostrarConvite(convite); }
  try {
    const s = await (await fetch('api/sessao')).json();
    if (s.logado) return iniciarApp();
    s.configurado ? mostrarEntrada() : mostrarPrimeiroAcesso();
  } catch { mostrarEntrada('Sem conexão com a Central.'); }
})();

// Mensagem nova chega sozinha: a caixa e os números se atualizam enquanto a página está aberta.
setInterval(() => {
  if ($('#app').hidden || document.hidden || !$('#gaveta').hidden) return;
  if (document.activeElement?.matches('#conteudo input, #conteudo textarea, #conteudo select')) return;
  const agora = Date.now();
  if (UI.aba === 'conexoes' && D.contas?.some((c) => c.tipo === 'whatsapp' && (c.estado?.pedido || (c.estado?.codigo && !c.estado?.conectado)))) return carregarAba();
  if (agora - (UI.vistoEm || 0) < 30e3) return;
  UI.vistoEm = agora;
  if (UI.aba === 'caixa' || UI.aba === 'hoje') { const y = $('.itens')?.scrollTop; carregarAba().then(() => { if (y != null && $('.itens')) $('.itens').scrollTop = y; }); }
  if (UI.aba !== 'hoje' && agora - (UI.hojeEm || 0) > 60e3) { UI.hojeEm = agora; atualizarContagens(); }
}, 5e3);
</script>
