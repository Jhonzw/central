<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central</title>
<style>
  /* IBM Plex servida pela própria Central (OFL): a página não chama ninguém de fora. */
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; font-display: swap; src: url(fontes/plex-sans.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fontes/plex-mono-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fontes/plex-mono-500.woff2) format("woff2"); }
  :root {
    --bg: #f7f6f2; --papel: #fdfcf9; --tinta: #1c1b19; --suave: #6f6c64; --fio: #e3e0d8;
    --acento: #0e5a55; --acento-fundo: #e5efec; --vermelho: #b3261e; --vermelho-fundo: #f8e6e3; --ambar: #9a5b00; --verde: #2f7a47;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141412; --papel: #1b1b18; --tinta: #ecebe6; --suave: #9c998f; --fio: #2c2b27;
      --acento: #6cc3b6; --acento-fundo: #1d2e2b; --vermelho: #f08a80; --vermelho-fundo: #3a1f1c; --ambar: #e0a650; --verde: #79c792; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tinta);
    font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  a { color: var(--acento); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .topo { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--fio); }
  .topo-dentro { max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 28px; height: 54px; }
  .marca { font-weight: 600; letter-spacing: -.01em; }
  nav { display: flex; gap: 22px; height: 100%; }
  nav button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--suave); height: 100%;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button:hover { color: var(--tinta); }
  nav button.ativo { color: var(--tinta); border-bottom-color: var(--acento); font-weight: 500; }
  .estado { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--suave); }
  .btn { background: none; border: 1px solid var(--fio); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--suave); }
  .btn.forte { background: var(--acento); border-color: var(--acento); color: var(--papel); }
  .btn.perigo:hover { border-color: var(--vermelho); color: var(--vermelho); }

  main { max-width: 1120px; margin: 0 auto; padding: 36px 24px 80px; }
  .saudacao h1, .cabeca h1 { font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; }
  .cabeca h1 { font-size: 24px; }
  .saudacao p, .cabeca p { margin: 0; color: var(--suave); max-width: 760px; }
  .rotulo { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--suave);
    margin: 44px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--tinta); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rotulo small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .cor { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; vertical-align: 0; }

  .linha { display: grid; grid-template-columns: 52px 1fr auto; gap: 18px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--fio); }
  .linha .ord { font: 500 13px/1.9 "IBM Plex Mono", ui-monospace, monospace; color: var(--suave); }
  .linha.urgente .ord { color: var(--vermelho); }
  .linha h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .linha p { margin: 2px 0 0; color: var(--suave); font-size: 14px; }
  .linha .lado { text-align: right; white-space: nowrap; }
  .linha .qtd { font-size: 22px; font-weight: 600; line-height: 1.1; }
  .linha.clicavel { cursor: pointer; }
  .linha.clicavel:hover { background: color-mix(in srgb, var(--papel) 70%, transparent); }
  .linha.aberta { background: var(--papel); border-bottom-color: transparent; }
  .vazio, .carregando, .falhou { padding: 14px 0; color: var(--suave); border-bottom: 1px solid var(--fio); }
  .falhou { color: var(--vermelho); }
  .sec { color: var(--suave); font-size: 13px; }
  .velho { color: var(--vermelho); } .morno { color: var(--ambar); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }

  .nova { display: grid; grid-template-columns: 170px 1fr 150px auto; gap: 10px; margin-top: 24px; }
  input, select, textarea { padding: 7px 9px; border: 1px solid var(--fio); border-radius: 6px; background: var(--papel); font-size: 14px; color: var(--tinta); width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  label { font-size: 12px; color: var(--suave); display: block; }
  label > input, label > select, label > textarea { margin-top: 3px; }

  .seletor { display: flex; flex-wrap: wrap; margin: 22px 0 0; border: 1px solid var(--fio); border-radius: 8px; overflow: hidden; width: fit-content; max-width: 100%; }
  .seletor button { background: var(--papel); border: 0; border-right: 1px solid var(--fio); padding: 8px 16px; cursor: pointer; text-align: left; }
  .seletor button:last-child { border-right: 0; }
  .seletor button b { display: block; font-size: 17px; font-weight: 600; }
  .seletor button span { font-size: 12px; color: var(--suave); }
  .seletor button.ativo { background: var(--acento-fundo); box-shadow: inset 0 -2px 0 var(--acento); }
  .filtros { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 20px 0 0; font-size: 14px; align-items: center; }
  .filtros button { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--suave); border-bottom: 2px solid transparent; }
  .filtros button.ativo { color: var(--tinta); border-bottom-color: var(--acento); }
  .filtros input { width: 240px; }

  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .etq { font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--fio); color: var(--suave); background: var(--papel); }
  .etq.vencida { border-color: var(--vermelho); color: var(--vermelho); background: var(--vermelho-fundo); }

  .ficha { background: var(--papel); border-bottom: 1px solid var(--fio); padding: 6px 4px 22px 70px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .ficha h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .atalhos { display: flex; gap: 6px; margin-top: 4px; }
  .atalhos button { font-size: 12px; padding: 1px 8px; }
  .acoes { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .salvo { font-size: 13px; color: var(--verde); } .salvo.erro { color: var(--vermelho); }
  .historico div { padding: 7px 0; border-top: 1px solid var(--fio); font-size: 14px; white-space: pre-wrap; }
  .historico time { display: block; font-size: 12px; color: var(--suave); }
  .historico button { float: right; background: none; border: 0; color: var(--suave); cursor: pointer; font-size: 12px; }
  .historico button:hover { color: var(--vermelho); }
  .canal { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; margin-top: 6px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 14px; color: var(--tinta); }
  .checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--tinta); }
  .checks input { width: auto; }
  .espaco-linha { display: grid; grid-template-columns: 140px 1fr 70px 70px auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--fio); }
  .espaco-linha input[type=color] { padding: 2px; height: 34px; }
  .rodape { margin-top: 40px; font-size: 13px; color: var(--suave); }

  .busca-topo { width: 190px; padding: 4px 9px; font-size: 13px; }
  .entrada { max-width: 400px; margin: 12vh auto 0; }
  .entrada h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
  .entrada p { color: var(--suave); margin: 0 0 22px; }
  .entrada label { margin-top: 12px; }
  .entrada .btn { margin-top: 18px; padding: 8px 18px; }
  .segredo { font: 500 17px/1.6 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .06em; padding: 12px 14px;
    background: var(--papel); border: 1px solid var(--fio); border-radius: 6px; word-break: break-all; user-select: all; }
  .qr { width: 220px; max-width: 100%; margin: 12px 0 4px; border-radius: 6px; overflow: hidden; }
  .qr svg { display: block; width: 100%; height: auto; }
  .entrada .dica { font-size: 13px; color: var(--suave); margin: 10px 0 6px; }

  .msgs { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow: auto; padding-right: 4px; }
  .msg { border-left: 2px solid var(--fio); padding: 2px 0 2px 12px; }
  .msg.minha { border-left-color: var(--acento); }
  .msg .quem { font-size: 12px; color: var(--suave); }
  .msg .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; margin-top: 2px; }
  .msg .ass { font-weight: 500; font-size: 14px; }
  .aviso { font-size: 13px; color: var(--suave); border-left: 2px solid var(--ambar); padding: 2px 0 2px 10px; margin: 10px 0 0; }
  .grade-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px; margin-top: 14px; }
  .grade-form .largo { grid-column: span 2; }
  .conta { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--fio); align-items: start; }
  .conta h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .conta p { margin: 2px 0 0; color: var(--suave); font-size: 14px; }
  .conta .acoes { margin-top: 0; justify-content: flex-end; }
  .codigo-par { font: 600 28px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .12em; color: var(--acento); margin-top: 6px; }
  .ok { color: var(--verde); }
  .resultado-busca mark { background: var(--acento-fundo); color: inherit; }

  @media (max-width: 820px) {
    .topo-dentro { gap: 16px; padding: 0 16px; }
    nav { gap: 14px; }
    main { padding: 24px 16px 60px; }
    .linha { grid-template-columns: 30px 1fr auto; gap: 10px; }
    .nova { grid-template-columns: 1fr 1fr; }
    .nova input[name=titulo] { grid-column: 1 / 3; }
    .ficha { grid-template-columns: 1fr; padding-left: 4px; }
    .espaco-linha { grid-template-columns: 1fr 1fr; }
    .filtros input { width: 100%; }
    .topo-dentro { flex-wrap: wrap; height: auto; padding-top: 10px; gap: 8px 16px; }
    .topo-dentro nav { order: 3; width: 100%; height: 42px; overflow-x: auto; scrollbar-width: none; }
    .topo-dentro nav button { flex: none; }
    #quando { display: none; }
    .busca-topo { width: 130px; }
    .grade-form { grid-template-columns: 1fr 1fr; }
    .conta { grid-template-columns: 1fr; }
    .conta .acoes { justify-content: flex-start; }
  }
</style>
</head>
<body>
<header class="topo" id="topo" hidden><div class="topo-dentro">
  <div class="marca">Central</div>
  <nav>
    <button data-aba="hoje" class="ativo">Hoje</button>
    <button data-aba="caixa">Caixa</button>
    <button data-aba="tarefas">Tarefas</button>
    <button data-aba="pessoas">Pessoas</button>
    <button data-aba="espacos">Espaços</button>
    <button data-aba="conexoes">Conexões</button>
  </nav>
  <div class="estado"><input class="busca-topo" id="busca-topo" type="search" placeholder="Buscar em tudo" aria-label="Buscar em tudo"><span id="quando"></span><button class="btn" id="atualizar">Atualizar</button><button class="btn" id="sair">Sair</button></div>
</div></header>

<main>
  <section id="entrada" hidden></section>
  <section id="aba-hoje" hidden></section>
  <section id="aba-caixa" hidden></section>
  <section id="aba-tarefas" hidden></section>
  <section id="aba-pessoas" hidden></section>
  <section id="aba-espacos" hidden></section>
  <section id="aba-conexoes" hidden></section>
  <section id="aba-busca" hidden></section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const dd = (i) => String(i + 1).padStart(2, '0');
const hojeIso = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const somarDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }); };
const dataCurta = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const quando = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const NOME_STATUS = { 'a-fazer': 'A fazer', fazendo: 'Fazendo', aguardando: 'Aguardando', feito: 'Feito', cancelado: 'Cancelado' };
const TIPOS_CANAL = { email: 'E-mail', whatsapp: 'WhatsApp', telefone: 'Telefone', outro: 'Outro' };
// 5562999990000 -> +55 62 99999-0000 (só para mostrar; o banco guarda os dígitos).
const fone = (d) => { const m = String(d).match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m ? `+55 ${m[1]} ${m[2]}-${m[3]}` : d; };

const D = { hoje: null, espacos: [], todosEspacos: [], tarefas: null, pessoas: null, conversas: null, conversa: null,
  contas: null, tokens: null, sessoes: null, conectores: null, busca: null, vocab: { status: [], estados: [] }, erro: null };
const UI = { aba: 'hoje', espaco: 'todos', filtro: 'abertas', estado: 'responder', busca: '', buscaTudo: '', ficha: null, pessoa: null,
  conversa: null, novaPessoa: null, msg: null, tokenNovo: null };
const NOME_ESTADO = { responder: 'Responder', esperando: 'Esperando', resolvida: 'Resolvidas', arquivada: 'Arquivadas' };
const ABAS = ['hoje', 'caixa', 'tarefas', 'pessoas', 'espacos', 'conexoes', 'busca'];

// Caminhos relativos à página: a Central funciona tanto na raiz de um domínio quanto em /central/.
async function api(metodo, caminho, corpo) {
  const r = await fetch(caminho.slice(1), { method: metodo, headers: corpo ? { 'Content-Type': 'application/json', 'X-Central': '1' } : { 'X-Central': '1' },
    body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !caminho.startsWith('/api/entrar') && !caminho.startsWith('/api/convite')) { mostrarEntrada(); throw new Error('sessão encerrada'); }
  if (!r.ok) throw new Error(j.erro || `HTTP ${r.status}`);
  return j;
}
const espacoPor = (id) => D.todosEspacos.find((e) => e.id === id) || { id, nome: id, cor: '#888888' };
const marcaEspaco = (id) => { const e = espacoPor(id); return `<span class="cor" style="background:${esc(e.cor)}"></span>${esc(e.nome)}`; };

// ---------- Navegação ----------
function ir(aba) {
  UI.aba = aba; UI.ficha = null; UI.pessoa = null; UI.msg = null;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('ativo', b.dataset.aba === aba));
  document.querySelectorAll('main > section').forEach((s) => s.hidden = s.id !== 'aba-' + aba);
  history.replaceState(null, '', aba === 'hoje' ? location.pathname : '#' + aba);
  carregarAba();
  scrollTo({ top: 0 });
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => ir(b.dataset.aba));
$('#atualizar').onclick = () => carregarTudo(true);
$('#sair').onclick = async () => { try { await api('POST', '/api/sair', {}); } catch {} mostrarEntrada(); };
$('#busca-topo').onkeydown = (e) => { if (e.key === 'Enter' && e.target.value.trim()) { UI.buscaTudo = e.target.value.trim(); ir('busca'); } };

async function carregarTudo(forcar) {
  try {
    [D.espacos, D.todosEspacos, D.vocab] = await Promise.all([api('GET', '/api/espacos'), api('GET', '/api/espacos?todos'), api('GET', '/api/vocabulario')]);
  } catch (e) { D.erro = e.message; }
  await carregarAba(forcar);
}
async function carregarAba(forcar) {
  const qs = UI.espaco === 'todos' ? '' : `espaco=${encodeURIComponent(UI.espaco)}`;
  try {
    if (UI.aba === 'hoje') { $('#quando').textContent = 'atualizando…'; D.hoje = await api('GET', '/api/hoje' + (forcar ? '?forcar' : '')); }
    if (UI.aba === 'tarefas' || UI.aba === 'hoje') D.tarefas = await api('GET', `/api/tarefas?${qs}${UI.filtro === 'todas' ? '&todas' : ''}`);
    if (UI.aba === 'pessoas' || UI.aba === 'tarefas') D.pessoas = await api('GET', `/api/pessoas?${qs}${UI.busca ? '&q=' + encodeURIComponent(UI.busca) : ''}`);
    if (UI.aba === 'caixa') {
      D.conversas = await api('GET', `/api/conversas?${qs}&estado=${UI.estado}`);
      D.conversa = UI.conversa ? await api('GET', `/api/conversas/${UI.conversa}`).catch(() => null) : null;
    }
    if (UI.aba === 'conexoes') {
      [D.contas, D.tokens, D.sessoes, D.conectores] = await Promise.all([api('GET', '/api/contas'), api('GET', '/api/tokens'), api('GET', '/api/sessoes'), api('GET', '/api/conectores')]);
    }
    if (UI.aba === 'busca') D.busca = await api('GET', `/api/busca?q=${encodeURIComponent(UI.buscaTudo)}`);
    D.erro = null;
  } catch (e) { D.erro = e.message; }
  $('#quando').textContent = D.hoje ? `às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : '';
  desenhar();
}

document.addEventListener('click', async (e) => {
  const alvo = (s) => e.target.closest(s);
  if (alvo('a')) return;
  if (alvo('[data-espaco]')) { UI.espaco = alvo('[data-espaco]').dataset.espaco; UI.ficha = null; UI.pessoa = null; return carregarAba(); }
  if (alvo('[data-filtro]')) { UI.filtro = alvo('[data-filtro]').dataset.filtro; return carregarAba(); }
  if (alvo('[data-prazo]')) { alvo('.ficha').querySelector('[name=proxima]').value = somarDias(Number(alvo('[data-prazo]').dataset.prazo)); return; }
  if (alvo('[data-sem-data]')) { alvo('.ficha').querySelector('[name=proxima]').value = ''; return; }
  if (alvo('[data-salvar-tarefa]')) return salvarTarefa(alvo('.ficha'));
  if (alvo('[data-apagar-anotacao]')) return mexerTarefa(Number(alvo('.ficha').dataset.id), { apagarAnotacao: Number(alvo('[data-apagar-anotacao]').dataset.apagarAnotacao) });
  if (alvo('[data-nova-pessoa]')) { UI.pessoa = 'nova'; return desenhar(); }
  if (alvo('[data-mais-canal]')) { const f = alvo('.ficha'); f.querySelector('.lista-canais').insertAdjacentHTML('beforeend', linhaCanal({ tipo: 'whatsapp', valor: '' })); return; }
  if (alvo('[data-tirar-canal]')) { alvo('.canal').remove(); return; }
  if (alvo('[data-salvar-pessoa]')) return salvarPessoa(alvo('.ficha'));
  if (alvo('[data-apagar-pessoa]')) {
    if (!confirm('Apagar esta pessoa? As tarefas ficam, sem a pessoa.')) return;
    try { await api('DELETE', `/api/pessoas/${alvo('.ficha').dataset.id}`); UI.pessoa = null; } catch (er) { UI.msg = { erro: er.message }; }
    return carregarAba();
  }
  if (alvo('[data-salvar-espaco]')) return salvarEspaco(alvo('.espaco-linha'));
  if (alvo('.ficha')) return;
  const t = alvo('[data-tarefa]');
  if (t) { UI.ficha = UI.ficha === t.dataset.tarefa ? null : t.dataset.tarefa; UI.msg = null; return desenhar(); }
  const p = alvo('[data-pessoa]');
  if (p) { UI.pessoa = UI.pessoa === p.dataset.pessoa ? null : p.dataset.pessoa; UI.msg = null; return desenhar(); }
});
document.addEventListener('submit', async (e) => {
  if (!e.target.matches('.nova')) return;
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api('POST', '/api/tarefas', { espaco_id: f.get('espaco'), titulo: f.get('titulo'), proxima: f.get('proxima') || null });
    UI.msg = { ok: 'Tarefa criada' };
    e.target.reset();
    e.target.querySelector('[name=espaco]').value = f.get('espaco');
  } catch (er) { UI.msg = { erro: er.message }; }
  carregarAba();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('.ficha textarea')) e.target.closest('.ficha').querySelector('[data-salvar-tarefa], [data-salvar-pessoa]')?.click();
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[name=busca]')) { UI.busca = e.target.value; clearTimeout(UI.t); UI.t = setTimeout(() => carregarAba().then(() => { const b = $('[name=busca]'); b?.focus(); b?.setSelectionRange(b.value.length, b.value.length); }), 250); }
});

async function mexerTarefa(id, dados) {
  try { await api('PATCH', `/api/tarefas/${id}`, dados); UI.msg = { ok: 'Salvo' }; } catch (er) { UI.msg = { erro: er.message }; }
  await carregarAba();
}
function salvarTarefa(fx) {
  const v = (n) => fx.querySelector(`[name=${n}]`).value;
  return mexerTarefa(Number(fx.dataset.id), { titulo: v('titulo'), status: v('status'), pessoa_id: v('pessoa') || null, proxima: v('proxima') || null, nota: v('nota') });
}
async function salvarPessoa(fx) {
  const v = (n) => fx.querySelector(`[name=${n}]`).value;
  const dados = {
    nome: v('nome'), notas: v('notas'),
    espacos: [...fx.querySelectorAll('[name=esp]:checked')].map((c) => c.value),
    canais: [...fx.querySelectorAll('.canal')].map((c) => ({ tipo: c.querySelector('select').value, valor: c.querySelector('input').value.trim() })).filter((c) => c.valor),
  };
  try {
    const p = fx.dataset.id ? await api('PUT', `/api/pessoas/${fx.dataset.id}`, dados) : await api('POST', '/api/pessoas', dados);
    UI.pessoa = String(p.id); UI.novaPessoa = null; UI.msg = { ok: 'Salvo' };
  } catch (er) { UI.msg = { erro: er.message }; }
  carregarAba();
}
async function salvarEspaco(l) {
  const v = (n) => l.querySelector(`[name=${n}]`);
  try {
    await api('POST', '/api/espacos', { id: v('id').value.trim(), nome: v('nome').value, cor: v('cor').value, ordem: Number(v('ordem').value) || 0, arquivado: v('arquivado').checked });
    UI.msg = { ok: 'Espaço salvo' };
  } catch (er) { UI.msg = { erro: er.message }; }
  carregarTudo();
}

// ---------- Desenho ----------
function desenhar() {
  ({ hoje: desenharHoje, caixa: desenharCaixa, tarefas: desenharTarefas, pessoas: desenharPessoas, espacos: desenharEspacos,
    conexoes: desenharConexoes, busca: desenharBusca })[UI.aba]();
}
const mensagem = () => UI.msg ? `<span class="salvo ${UI.msg.erro ? 'erro' : ''}">${esc(UI.msg.erro ? 'Não salvou: ' + UI.msg.erro : UI.msg.ok)}</span>` : '';
const falha = () => D.erro ? `<div class="falhou">Erro: ${esc(D.erro)}</div>` : '';

function saudacao() {
  const h = Number(new Date().toLocaleString('pt-BR', { hour: 'numeric', hour12: false, timeZone: 'America/Sao_Paulo' }));
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}

function formNova() {
  const padrao = UI.espaco !== 'todos' ? UI.espaco : D.espacos[0]?.id;
  return `<form class="nova">
    <select name="espaco" aria-label="Espaço">${D.espacos.map((e) => `<option value="${esc(e.id)}" ${e.id === padrao ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>
    <input name="titulo" placeholder="Nova tarefa: o que fazer, com quem…" required maxlength="200" aria-label="Título">
    <input name="proxima" type="date" aria-label="Quando">
    <button class="btn forte">Criar</button>
  </form>${mensagem()}`;
}

function desenharHoje() {
  const h = D.hoje;
  const data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Sao_Paulo' });
  if (!h) { $('#aba-hoje').innerHTML = falha() || '<div class="carregando">Montando o seu dia…</div>'; return; }
  const contar = (e) => e.vencidas.length + e.deHoje.length + (e.conversas.responder ? 1 : 0) + e.fontes.reduce((a, f) => a + f.itens.filter((i) => i.urgente).length, 0);
  const urgentes = h.espacos.reduce((a, e) => a + contar(e), 0);
  const blocos = h.espacos.map((e) => {
    const linhas = [];
    for (const t of e.vencidas) linhas.push({ urgente: true, titulo: t.titulo, desc: `Venceu ${dataCurta(t.proxima)}${t.pessoa_nome ? ' · ' + t.pessoa_nome : ''} · ${NOME_STATUS[t.status]}`, tarefa: t.id });
    for (const t of e.deHoje) linhas.push({ titulo: t.titulo, desc: `Hoje${t.pessoa_nome ? ' · ' + t.pessoa_nome : ''} · ${NOME_STATUS[t.status]}`, tarefa: t.id });
    if (e.conversas.responder) linhas.push({ urgente: e.conversas.responder > 0, titulo: `${plural(e.conversas.responder, 'conversa pede', 'conversas pedem')} resposta`,
      desc: e.conversas.primeiras.slice(0, 3).map((c) => `${c.pessoa_nome || c.titulo} (${quando(c.ultima_em)})`).join(' · '), qtd: e.conversas.responder, caixa: e.espaco.id });
    for (const f of e.fontes) {
      for (const i of [...f.itens].sort((a, b) => b.urgente - a.urgente)) linhas.push({ ...i, fonte: f.nome });
    }
    const erros = e.fontes.filter((f) => f.erro).map((f) => `<div class="falhou">${esc(f.nome)}: ${esc(f.erro)}${f.em ? ' · mostrando a leitura anterior' : ''}</div>`).join('');
    return `<div class="rotulo"><span>${marcaEspaco(e.espaco.id)}</span><small>${plural(e.abertas, 'tarefa aberta', 'tarefas abertas')}</small></div>
      ${linhas.map((l, i) => `<div class="linha${l.urgente ? ' urgente' : ''}${l.tarefa || l.caixa ? ' clicavel' : ''}" ${l.tarefa ? `data-tarefa-hoje="${l.tarefa}"` : ''}${l.caixa ? ` data-caixa-hoje="${esc(l.caixa)}"` : ''}>
        <div class="ord">${dd(i)}</div>
        <div><h3>${esc(l.titulo)}</h3><p>${esc(l.desc || '')}${l.fonte ? `${l.desc ? ' · ' : ''}${esc(l.fonte)}` : ''}</p></div>
        <div class="lado">${l.qtd != null ? `<span class="qtd">${l.qtd}</span><br>` : ''}${l.link ? `<a href="${esc(l.link)}" target="_blank" rel="noopener noreferrer">abrir →</a>` : l.tarefa ? '<span class="sec">tarefa</span>' : l.caixa ? '<span class="sec">caixa</span>' : ''}</div>
      </div>`).join('') || (erros ? '' : '<div class="vazio">Nada pedindo ação.</div>')}${erros}`;
  }).join('');
  $('#aba-hoje').innerHTML = `
    <div class="saudacao"><h1>${saudacao()}${D.vocab.nome ? ', ' + esc(D.vocab.nome) : ''}.</h1>
      <p>${data[0].toUpperCase() + data.slice(1)}. ${urgentes ? `${plural(urgentes, 'coisa venceu ou é', 'coisas venceram ou são')} para hoje, somando todos os espaços.` : 'Nada vencido em nenhum espaço.'}</p></div>
    ${formNova()}
    ${falha()}${blocos}
    <p class="rodape">Cada espaço é separado: tarefas, pessoas, conversas e fontes de um não aparecem no outro. E-mail, WhatsApp e painéis só são lidos: nada sai daqui.</p>`;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tarefa-hoje]');
  if (t && !e.target.closest('a')) { UI.espaco = 'todos'; UI.filtro = 'abertas'; ir('tarefas'); UI.ficha = t.dataset.tarefaHoje; }
  const c = e.target.closest('[data-caixa-hoje]');
  if (c) { UI.espaco = c.dataset.caixaHoje; UI.estado = 'responder'; UI.conversa = null; ir('caixa'); }
});

function seletorEspacos(contagem) {
  return `<div class="seletor">
    <button data-espaco="todos" class="${UI.espaco === 'todos' ? 'ativo' : ''}"><b>${contagem('todos') ?? ''}</b><span>Todos</span></button>
    ${D.espacos.map((e) => `<button data-espaco="${esc(e.id)}" class="${UI.espaco === e.id ? 'ativo' : ''}"><b>${contagem(e.id) ?? ''}</b><span>${marcaEspaco(e.id)}</span></button>`).join('')}
  </div>`;
}

function desenharTarefas() {
  const ts = D.tarefas;
  if (!ts) { $('#aba-tarefas').innerHTML = falha() || '<div class="carregando">Carregando…</div>'; return; }
  const hoje = hojeIso();
  const grupos = [
    ['Venceu', ts.filter((t) => t.proxima && t.proxima < hoje && !t.concluido)],
    ['Hoje', ts.filter((t) => t.proxima === hoje && !t.concluido)],
    ['Próximos dias', ts.filter((t) => t.proxima && t.proxima > hoje && !t.concluido)],
    ['Sem data', ts.filter((t) => !t.proxima && !t.concluido)],
    ['Fechadas', ts.filter((t) => t.concluido)],
  ].filter(([, l]) => l.length);
  // Atualmente aberta (mudou de espaço/filtro): a ficha some se a tarefa não está mais na lista.
  if (UI.ficha && !ts.some((t) => String(t.id) === String(UI.ficha))) UI.ficha = null;
  $('#aba-tarefas').innerHTML = `
    <div class="cabeca"><h1>${plural(ts.filter((t) => !t.concluido).length, 'tarefa aberta', 'tarefas abertas')}${UI.espaco === 'todos' ? '' : ' em ' + esc(espacoPor(UI.espaco).nome)}</h1>
      <p>Clique numa tarefa para mudar status, com quem está, a próxima data e anotar.</p></div>
    ${seletorEspacos((id) => id === UI.espaco ? ts.filter((t) => !t.concluido).length : null)}
    <div class="filtros">
      <button data-filtro="abertas" class="${UI.filtro === 'abertas' ? 'ativo' : ''}">Abertas</button>
      <button data-filtro="todas" class="${UI.filtro === 'todas' ? 'ativo' : ''}">Com as fechadas</button>
    </div>
    ${formNova()}
    ${falha()}
    ${grupos.map(([titulo, lista]) => `<div class="rotulo">${titulo}<small>${lista.length}</small></div>${lista.map(linhaTarefa).join('')}`).join('')
      || '<div class="vazio" style="margin-top:24px">Nenhuma tarefa aqui.</div>'}`;
}

function linhaTarefa(t) {
  const hoje = hojeIso();
  const vencida = t.proxima && t.proxima < hoje && !t.concluido;
  const aberta = String(UI.ficha) === String(t.id);
  return `<div class="linha clicavel${aberta ? ' aberta' : ''}" data-tarefa="${t.id}">
    <div class="ord">${UI.espaco === 'todos' ? `<span class="cor" style="background:${esc(espacoPor(t.espaco_id).cor)}" title="${esc(espacoPor(t.espaco_id).nome)}"></span>` : ''}</div>
    <div><h3>${esc(t.titulo)}</h3>
      <div class="etiquetas"><span class="etq">${NOME_STATUS[t.status]}</span>${t.pessoa_nome ? `<span class="etq">com ${esc(t.pessoa_nome)}</span>` : ''}
        ${t.anotacoes.length ? `<span class="etq">${plural(t.anotacoes.length, 'anotação', 'anotações')}</span>` : ''}${t.origem ? `<span class="etq">${esc(t.origem)}</span>` : ''}</div></div>
    <div class="lado ${vencida ? 'velho' : ''}">${t.proxima ? (t.proxima === hoje ? 'hoje' : dataCurta(t.proxima)) : '<span class="sec">sem data</span>'}
      ${UI.espaco === 'todos' ? `<div class="sec">${esc(espacoPor(t.espaco_id).nome)}</div>` : ''}</div>
  </div>${aberta ? fichaTarefa(t) : ''}`;
}

function fichaTarefa(t) {
  const pessoas = (D.pessoas || []).filter((p) => p.espacos.some((e) => e.id === t.espaco_id));
  return `<div class="ficha" data-id="${t.id}">
    <div>
      <h4>Tarefa · ${marcaEspaco(t.espaco_id)}</h4>
      <label>Título<input name="titulo" value="${esc(t.titulo)}" maxlength="200"></label>
      <div class="campos" style="margin-top:10px">
        <label>Status<select name="status">${D.vocab.status.map((s) => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${NOME_STATUS[s]}</option>`).join('')}</select></label>
        <label>Com quem<select name="pessoa"><option value="">—</option>${pessoas.map((p) => `<option value="${p.id}" ${p.id === t.pessoa_id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
        <label>Próxima data<input type="date" name="proxima" value="${esc(t.proxima || '')}">
          <span class="atalhos"><button class="btn" data-prazo="1">amanhã</button><button class="btn" data-prazo="7">+7 d</button><button class="btn" data-sem-data>sem data</button></span></label>
      </div>
      ${pessoas.length ? '' : '<p class="sec">Nenhuma pessoa ligada a este espaço ainda (aba Pessoas).</p>'}
      <p class="sec">Criada ${quando(t.criado)}${t.concluido ? ` · fechada ${quando(t.concluido)}` : ''}</p>
    </div>
    <div>
      <h4>Anotar</h4>
      <textarea name="nota" placeholder="O que aconteceu, o que falta, com quem falou…"></textarea>
      <div class="acoes"><button class="btn forte" data-salvar-tarefa>Salvar</button><span class="sec">Ctrl+Enter salva</span>${mensagem()}</div>
      ${t.anotacoes.length ? `<div class="historico" style="margin-top:14px">${t.anotacoes.map((n) => `<div><button data-apagar-anotacao="${n.id}">apagar</button><time>${quando(n.em)}</time>${esc(n.texto)}</div>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function desenharPessoas() {
  const ps = D.pessoas;
  if (!ps) { $('#aba-pessoas').innerHTML = falha() || '<div class="carregando">Carregando…</div>'; return; }
  $('#aba-pessoas').innerHTML = `
    <div class="cabeca"><h1>${plural(ps.length, 'pessoa', 'pessoas')}${UI.espaco === 'todos' ? '' : ' em ' + esc(espacoPor(UI.espaco).nome)}</h1>
      <p>Uma pessoa, todos os canais dela. A mesma pessoa pode estar em mais de um espaço.</p></div>
    ${seletorEspacos((id) => id === UI.espaco ? ps.length : null)}
    <div class="filtros"><input name="busca" placeholder="Buscar por nome, e-mail ou número" value="${esc(UI.busca)}"><button class="btn" data-nova-pessoa>Nova pessoa</button></div>
    ${falha()}
    <div style="margin-top:18px;border-top:1px solid var(--tinta)">
    ${UI.pessoa === 'nova' ? fichaPessoa(UI.novaPessoa || { nome: '', notas: '', espacos: UI.espaco === 'todos' ? [] : [{ id: UI.espaco }], canais: [] }) : ''}
    ${ps.map((p) => `<div class="linha clicavel${UI.pessoa === String(p.id) ? ' aberta' : ''}" data-pessoa="${p.id}">
        <div class="ord">#${p.id}</div>
        <div><h3>${esc(p.nome)}</h3><p>${p.canais.map((c) => `${TIPOS_CANAL[c.tipo]} ${esc(c.tipo === 'email' || c.tipo === 'outro' ? c.valor : fone(c.valor))}`).join(' · ') || 'sem canal'}</p></div>
        <div class="lado"><div class="etiquetas" style="justify-content:flex-end">${p.espacos.map((e) => `<span class="etq">${marcaEspaco(e.id)}</span>`).join('')}</div></div>
      </div>${UI.pessoa === String(p.id) ? fichaPessoa(p) : ''}`).join('') || (UI.pessoa === 'nova' ? '' : '<div class="vazio">Ninguém aqui ainda.</div>')}
    </div>`;
}

const linhaCanal = (c) => `<div class="canal"><select aria-label="Tipo">${Object.entries(TIPOS_CANAL).map(([k, n]) => `<option value="${k}" ${k === c.tipo ? 'selected' : ''}>${n}</option>`).join('')}</select>
  <input value="${esc(c.valor)}" placeholder="e-mail ou número com DDD" aria-label="Valor"><button class="btn" data-tirar-canal title="tirar">×</button></div>`;

function fichaPessoa(p) {
  const meus = new Set(p.espacos.map((e) => e.id));
  return `<div class="ficha" ${p.id ? `data-id="${p.id}"` : ''}>
    <div>
      <h4>${p.id ? 'Pessoa' : 'Nova pessoa'}</h4>
      <label>Nome<input name="nome" value="${esc(p.nome)}" maxlength="120"></label>
      <label style="margin-top:10px">Espaços</label>
      <div class="checks">${D.espacos.map((e) => `<label><input type="checkbox" name="esp" value="${esc(e.id)}" ${meus.has(e.id) ? 'checked' : ''}>${marcaEspaco(e.id)}</label>`).join('')}</div>
      <label style="margin-top:10px">Notas<textarea name="notas">${esc(p.notas)}</textarea></label>
    </div>
    <div>
      <h4>Canais</h4>
      <div class="lista-canais">${p.canais.map(linhaCanal).join('')}</div>
      <div class="acoes"><button class="btn" data-mais-canal>+ canal</button></div>
      <div class="acoes"><button class="btn forte" data-salvar-pessoa>Salvar</button>${p.id ? '<button class="btn perigo" data-apagar-pessoa>Apagar</button>' : ''}${mensagem()}</div>
    </div>
  </div>`;
}

function desenharEspacos() {
  const linha = (e, novo) => `<div class="espaco-linha">
    <input name="id" value="${esc(e.id)}" ${novo ? 'placeholder="id (ex.: loja)"' : 'readonly'} aria-label="Id">
    <input name="nome" value="${esc(e.nome)}" placeholder="Nome" aria-label="Nome">
    <input name="cor" type="color" value="${esc(e.cor)}" aria-label="Cor">
    <input name="ordem" type="number" value="${e.ordem}" aria-label="Ordem">
    <label class="checks"><input type="checkbox" name="arquivado" ${e.arquivado ? 'checked' : ''}>arquivado</label>
    <button class="btn ${novo ? 'forte' : ''}" data-salvar-espaco>${novo ? 'Criar' : 'Salvar'}</button>
  </div>`;
  $('#aba-espacos').innerHTML = `
    <div class="cabeca"><h1>Espaços</h1><p>Um espaço por empresa ou vida. Tudo de trabalho pertence a um espaço só. Espaço não se apaga: arquiva.</p></div>
    <div class="rotulo">Espaços<small>${mensagem()}</small></div>
    ${D.todosEspacos.map((e) => linha(e, false)).join('')}
    <div class="rotulo">Novo espaço</div>
    ${linha({ id: '', nome: '', cor: '#0e5a55', ordem: D.todosEspacos.length, arquivado: 0 }, true)}
    <p class="rodape">As fontes de cada espaço (painéis, e-mail, WhatsApp) ficam em config/local.json, fora do git.</p>`;
}

// ---------- Caixa ----------
function desenharCaixa() {
  const cs = D.conversas;
  if (!cs) { $('#aba-caixa').innerHTML = falha() || '<div class="carregando">Carregando…</div>'; return; }
  $('#aba-caixa').innerHTML = `
    <div class="cabeca"><h1>${plural(cs.length, 'conversa', 'conversas')} ${UI.estado === 'responder' ? 'pedindo resposta' : 'em ' + NOME_ESTADO[UI.estado].toLowerCase()}${UI.espaco === 'todos' ? '' : ' em ' + esc(espacoPor(UI.espaco).nome)}</h1>
      <p>E-mail e WhatsApp de cada espaço. Mudar o estado ou anotar aqui não mexe na caixa de verdade, e nada é enviado daqui.</p></div>
    ${seletorEspacos((id) => id === UI.espaco ? cs.length : null)}
    <div class="filtros">${D.vocab.estados.map((e) => `<button data-estado="${e}" class="${UI.estado === e ? 'ativo' : ''}">${NOME_ESTADO[e]}</button>`).join('')}</div>
    ${falha()}
    <div style="margin-top:18px;border-top:1px solid var(--tinta)">
    ${cs.map((c) => `<div class="linha clicavel${String(UI.conversa) === String(c.id) ? ' aberta' : ''}" data-conversa="${c.id}">
        <div class="ord">${c.canal === 'email' ? '@' : 'wa'}</div>
        <div><h3>${esc(c.pessoa_nome || (c.canal === 'whatsapp' ? (c.titulo || fone(c.endereco)) : c.titulo))}</h3>
          <p>${c.canal === 'email' && c.pessoa_nome ? esc(c.titulo) + ' · ' : ''}${c.ultima ? `${c.ultima.de_mim ? 'Você: ' : ''}${esc(c.ultima.texto || c.ultima.assunto || '')}` : ''}</p>
          <div class="etiquetas">${UI.espaco === 'todos' ? `<span class="etq">${marcaEspaco(c.espaco_id)}</span>` : ''}<span class="etq">${esc(c.conta_nome)}</span>${c.nota ? '<span class="etq">nota</span>' : ''}${c.tarefa_id ? '<span class="etq">virou tarefa</span>' : ''}${c.pessoa_id ? '' : '<span class="etq">sem cadastro</span>'}</div></div>
        <div class="lado sec">${quando(c.ultima_em)}<br>${plural(c.qtd, 'mensagem', 'mensagens')}</div>
      </div>${String(UI.conversa) === String(c.id) && D.conversa ? fichaConversa(D.conversa) : ''}`).join('') || '<div class="vazio">Nenhuma conversa aqui.</div>'}
    </div>`;
  const m = $('.msgs'); if (m) m.scrollTop = m.scrollHeight;
}

function fichaConversa(c) {
  return `<div class="ficha" data-id="${c.id}">
    <div>
      <h4>${c.canal === 'email' ? 'E-mail' : 'WhatsApp'} · ${esc(c.conta_nome)}${c.endereco ? ' · ' + esc(c.canal === 'email' ? c.endereco : fone(c.endereco)) : ''}</h4>
      <div class="msgs">${c.mensagens.map((m) => `<div class="msg ${m.de_mim ? 'minha' : ''}">
        <div class="quem">${m.de_mim ? 'Você' : esc(m.autor || 'Contato')} · ${quando(m.em)}</div>
        ${m.assunto && c.canal === 'email' ? `<div class="ass">${esc(m.assunto)}</div>` : ''}
        <div class="txt">${esc(m.texto) || '<span class="sec">(texto apagado pela retenção ou sem texto)</span>'}</div></div>`).join('')}</div>

async function salvarConversa(fx) {
  const v = (n) => fx.querySelector(`[name=${n}]`).value;
  try {
    await api('PATCH', `/api/conversas/${fx.dataset.id}`, { estado: v('estado'), nota: v('nota'), ...(v('espaco') !== D.conversa.espaco_id ? { espaco_id: v('espaco') } : {}) });
    UI.msg = { ok: 'Salvo' };
  } catch (er) { UI.msg = { erro: er.message }; }
  carregarAba();
}

// ---------- Conexões ----------
const ESTADO_WA = (c) => {
  const e = c.estado || {};
  const visto = e.visto ? Date.now() - Date.parse(e.visto) < 2 * 60e3 : false;
  if (e.restricao) return `<span class="velho">${esc(e.restricao)}</span>`;
  if (!visto) return '<span class="velho">o processo do WhatsApp não está rodando</span>';
  if (e.conectado) return `<span class="ok">conectado</span>${c.endereco ? ' · ' + esc(fone(c.endereco)) : ''}`;
  return e.erro ? `<span class="morno">${esc(e.erro)}</span>` : '<span class="morno">desconectado</span>';
};

// ---------- Ações da caixa, conexões e busca ----------
document.addEventListener('click', async (e) => {
  const alvo = (s) => e.target.closest(s);
  if (alvo('[data-estado]')) { UI.estado = alvo('[data-estado]').dataset.estado; UI.conversa = null; return carregarAba(); }
  if (alvo('[data-salvar-conversa]')) return salvarConversa(alvo('.ficha'));
  if (alvo('[data-virar-tarefa]')) {
    try { const t = await api('POST', `/api/conversas/${alvo('.ficha').dataset.id}/tarefa`, {}); UI.msg = { ok: `Tarefa #${t.id} criada` }; } catch (er) { UI.msg = { erro: er.message }; }
    return carregarAba();
  }
  if (alvo('[data-cadastrar-pessoa]')) {
    const c = D.conversa;
    UI.novaPessoa = { nome: c.canal === 'email' ? (c.mensagens.find((m) => !m.de_mim)?.autor || '') : (c.titulo || ''), notas: '',
      espacos: [{ id: c.espaco_id }], canais: c.endereco ? [{ tipo: c.canal === 'email' ? 'email' : 'whatsapp', valor: c.endereco }] : [] };
    UI.espaco = 'todos'; UI.busca = ''; ir('pessoas'); UI.pessoa = 'nova'; return;
  }
  const conv = alvo('[data-conversa]');
  if (conv && !alvo('.ficha')) { UI.conversa = String(UI.conversa) === conv.dataset.conversa ? null : conv.dataset.conversa; UI.msg = null; return carregarAba(); }
  const irConv = alvo('[data-ir-conversa]');
  if (irConv) { UI.espaco = irConv.dataset.espacoConversa; UI.estado = irConv.dataset.estadoConversa; ir('caixa'); UI.conversa = irConv.dataset.irConversa; return carregarAba(); }
  const irP = alvo('[data-ir-pessoa]');
  if (irP) { UI.espaco = 'todos'; UI.busca = ''; ir('pessoas'); UI.pessoa = irP.dataset.irPessoa; return; }

  const acao = async (fn, ok) => { try { await fn(); UI.msg = { ok }; } catch (er) { UI.msg = { erro: er.message }; } carregarAba(); };
  if (alvo('[data-ler-conta]')) { UI.msg = { ok: 'Lendo…' }; desenhar(); return acao(async () => { const r = await api('POST', `/api/contas/${alvo('[data-ler-conta]').dataset.lerConta}/ler`, {}); UI.msg = null; return r; }, 'Caixa lida'); }
  if (alvo('[data-apagar-conta]')) {
    if (!confirm('Apagar esta conta e todas as conversas dela na Central? A caixa de verdade não muda.')) return;
    return acao(() => api('DELETE', `/api/contas/${alvo('[data-apagar-conta]').dataset.apagarConta}`), 'Conta apagada');
  }
  if (alvo('[data-wa-parear]')) {
    const id = alvo('[data-wa-parear]').dataset.waParear;
    const numero = alvo('.conta').querySelector('[name=numero]').value;
    return acao(() => api('POST', `/api/contas/${id}/whatsapp`, { acao: 'parear', numero }), 'Pedido enviado: o código aparece aqui em alguns segundos');
  }
  if (alvo('[data-wa-desligar]')) {
    if (!confirm('Desligar este WhatsApp da Central? O aparelho sai da lista de conectados.')) return;
    return acao(() => api('POST', `/api/contas/${alvo('[data-wa-desligar]').dataset.waDesligar}/whatsapp`, { acao: 'desligar' }), 'Pedido de desligar enviado');
  }
  if (alvo('[data-token]')) {
    const b = alvo('[data-token]');
    try { UI.tokenNovo = await api('POST', '/api/tokens', { nome: b.dataset.tokenNome, escopo: b.dataset.token }); UI.msg = null; } catch (er) { UI.msg = { erro: er.message }; }
    await carregarAba(); scrollTo({ top: 0 }); return;
  }
  if (alvo('[data-revogar]')) {
    if (!confirm('Revogar este token? Quem usa ele para de funcionar na hora.')) return;
    return acao(() => api('DELETE', `/api/tokens/${alvo('[data-revogar]').dataset.revogar}`), 'Token revogado');
  }
  if (alvo('[data-sair-todas]')) {
    if (!confirm('Encerrar todas as sessões, inclusive esta?')) return;
    try { await api('POST', '/api/sessoes/sair-de-todas', {}); } catch {}
    return mostrarEntrada();
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (!f.matches('[data-form-email], [data-form-wa]')) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  try {
    await api('POST', '/api/contas', { ...d, tipo: f.matches('[data-form-email]') ? 'email' : 'whatsapp' });
    UI.msg = { ok: 'Conta ligada' }; f.reset();
  } catch (er) { UI.msg = { erro: er.message }; }
  carregarAba();
});

// ---------- Entrar e primeiro acesso ----------
function mostrarTela(app) {
  $('#topo').hidden = !app;
  $('#entrada').hidden = app;
  if (!app) document.querySelectorAll('main > section:not(#entrada)').forEach((s) => s.hidden = true);
}

function mostrarEntrada(erro) {
  mostrarTela(false);
  D.hoje = null;
  // O campo "usuario" escondido existe para o gerenciador de senhas: sem ele, o
  // navegador põe o seu login salvo no campo do código.
  $('#entrada').innerHTML = `<form class="entrada" data-entrar novalidate>
    <h1>Central</h1><p>Entre com a sua senha e o código do app autenticador.</p>
    <input name="usuario" autocomplete="username" value="central" hidden>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required autofocus></label>
    <label>Código do autenticador (6 números)<input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000"></label>
    <button class="btn forte">Entrar</button>
    ${erro ? `<p class="salvo erro" style="margin-top:14px">${esc(erro)}</p>` : ''}
  </form>`;
}

// Central sem dono: não adianta pedir senha. Pede o convite (link inteiro ou só o código).
function mostrarPrimeiroAcesso(erro) {
  mostrarTela(false);
  $('#entrada').innerHTML = `<form class="entrada" data-primeiro novalidate>
    <h1>Primeiro acesso</h1><p>A Central ainda não tem senha. Cole aqui o link de convite que você recebeu (ou só o código que começa com <b>cvt_</b>).</p>
    <label>Convite<input name="convite" autocomplete="off" spellcheck="false" placeholder="https://…/#convite=cvt_…" required autofocus></label>
    <button class="btn forte">Continuar</button>
    ${erro ? `<p class="salvo erro" style="margin-top:14px">${esc(erro)}</p>` : ''}
  </form>`;
}
const codigoLimpo = (v) => String(v || '').replace(/\s/g, '');

function mostrarConvite(convite, passo = 1, dados = {}, erro) {
  mostrarTela(false);
  $('#entrada').innerHTML = passo === 1 ? `<form class="entrada" data-convite-1>
      <h1>Primeiro acesso</h1><p>Escolha a senha da Central. Ela fica só com você: nem quem criou o convite vê.</p>
      <label>Senha (12 caracteres ou mais)<input name="senha" type="password" autocomplete="new-password" minlength="12" required autofocus></label>
      <label>Repita a senha<input name="senha2" type="password" autocomplete="new-password" minlength="12" required></label>
      <button class="btn forte">Continuar</button>
      ${erro ? `<p class="salvo erro" style="margin-top:14px">${esc(erro)}</p>` : ''}
    </form>` : `<form class="entrada" data-convite-2>
      <h1>Autenticador</h1><p>Abra o Google Authenticator (ou Aegis, 1Password) no celular, toque em <b>+</b> e <b>leia este QR code</b>:</p>
      <div class="qr">${dados.qr || ''}</div>
      <p class="dica">Sem câmera? Escolha "inserir chave de configuração" e digite:</p>
      <div class="segredo">${esc(dados.segredo.match(/.{1,4}/g).join(' '))}</div>
      <label>Código de 6 dígitos que o app mostra<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
      <button class="btn forte">Ativar</button>
      ${erro ? `<p class="salvo erro" style="margin-top:14px">${esc(erro)}</p>` : ''}
    </form>`;
  $('#entrada').dataset.convite = convite;
  UI.conviteDados = dados;
}

document.addEventListener('submit', async (e) => {
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));
  if (f.matches('[data-primeiro]')) {
    e.preventDefault();
    const c = String(d.convite || '').match(/cvt_[\w-]{20,}/)?.[0];
    return c ? mostrarConvite(c) : mostrarPrimeiroAcesso('Não achei o convite aí. Ele começa com cvt_.');
  }
  if (f.matches('[data-entrar]')) {
    e.preventDefault();
    d.codigo = codigoLimpo(d.codigo);
    if (!d.senha) return mostrarEntrada('Digite a senha.');
    if (!/^[0-9]{6}$/.test(d.codigo)) return mostrarEntrada('O código são os 6 números que aparecem no app autenticador (Google Authenticator, Aegis…), não o seu usuário.');
    try { await api('POST', '/api/entrar', { senha: d.senha, codigo: d.codigo }); iniciarApp(); } catch (er) { /configurada/.test(er.message) ? mostrarPrimeiroAcesso() : mostrarEntrada(er.message); }
  }
  if (f.matches('[data-convite-1]')) {
    e.preventDefault();
    const convite = $('#entrada').dataset.convite;
    if (d.senha !== d.senha2) return mostrarConvite(convite, 1, {}, 'As duas senhas não são iguais.');
    try { mostrarConvite(convite, 2, await api('POST', '/api/convite/abrir', { convite, senha: d.senha })); } catch (er) { mostrarConvite(convite, 1, {}, er.message); }
  }
  if (f.matches('[data-convite-2]')) {
    e.preventDefault();
    const convite = $('#entrada').dataset.convite;
    try {
      await api('POST', '/api/convite/ativar', { convite, codigo: codigoLimpo(d.codigo) });
      history.replaceState(null, '', location.pathname);
      mostrarEntrada();
      $('#entrada p').textContent = 'Pronto. Agora entre com a senha e um código novo do autenticador.';
    } catch (er) { mostrarConvite(convite, 2, UI.conviteDados, er.message); }
  }
});

function iniciarApp() {
  mostrarTela(true);
  const aba = location.hash.slice(1);
  UI.aba = ABAS.includes(aba) && aba !== 'busca' ? aba : 'hoje';
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('ativo', b.dataset.aba === UI.aba));
  document.querySelectorAll('main > section').forEach((s) => s.hidden = s.id !== 'aba-' + UI.aba);
  carregarTudo();
}

(async () => {
  const convite = location.hash.match(/^#convite=(cvt_[\w-]+)$/)?.[1];
  // O convite sai da barra de endereço na hora (não fica no histórico nem em print).
  if (convite) { history.replaceState(null, '', location.pathname); return mostrarConvite(convite); }
  try {
    const s = await (await fetch('api/sessao')).json();
    if (s.logado) return iniciarApp();
    s.configurado ? mostrarEntrada() : mostrarPrimeiroAcesso();
  } catch { mostrarEntrada('Sem conexão com a Central.'); }
})();
setInterval(() => {
  if ($('#topo').hidden || document.activeElement?.closest('form, .ficha')) return;
  if (UI.aba === 'hoje' && Date.now() - (UI.hojeEm || 0) > 3 * 60e3) { UI.hojeEm = Date.now(); carregarAba(); }
  // Pareando o WhatsApp: o código chega em segundos.
  if (UI.aba === 'conexoes' && D.contas?.some((c) => c.tipo === 'whatsapp' && (c.estado?.pedido || (c.estado?.codigo && !c.estado?.conectado)))) carregarAba();
}, 5e3);
</script>
